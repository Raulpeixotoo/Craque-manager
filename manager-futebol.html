<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craque Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --grama:#0f3d2e; --grama2:#12483a; --board:#0c1a14; --painel:#142a21; --linha:#25443a;
  --branco:#f2f5ee; --muted:#9bb3a6; --amarelo:#f5c518; --vermelho:#e0533f; --azul:#4aa3df;
  --fd:"Barlow Condensed","Arial Narrow",sans-serif; --fb:"Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--board);color:var(--branco);font-family:var(--fb);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel);color:var(--branco);padding:6px 12px;border-radius:4px;font-size:13px}
button:hover{border-color:var(--amarelo)}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--linha)}
button.primario{background:var(--amarelo);color:#1a1400;border-color:var(--amarelo);font-family:var(--fd);font-size:18px;font-weight:700;padding:8px 18px;letter-spacing:.3px}
button.primario:hover{background:#ffd54a}
select,input{font-family:inherit;background:var(--board);color:var(--branco);border:1px solid var(--linha);padding:5px 8px;border-radius:4px;font-size:13px}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:24px;margin-bottom:10px}
h3{font-size:18px;color:var(--amarelo)}
.num{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.neg{color:var(--vermelho)}
.pos{color:#7ee081}
#app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--painel);border-bottom:2px solid var(--amarelo)}
header .escudo{width:34px;height:34px;border-radius:50%;flex:none}
header .info{line-height:1.1}
header .info small{color:var(--muted)}
header .stats{margin-left:auto;display:flex;gap:22px;text-align:right}
header .stats div span{display:block;color:var(--muted);font-size:11px}
header .stats .num{font-size:22px}
nav{position:relative;display:flex;justify-content:center;gap:2px;padding:0 90px 0 18px;background:var(--painel);border-bottom:1px solid var(--linha);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;font-family:var(--fd);font-size:17px;font-weight:500;color:var(--muted)}
nav button:last-child{position:absolute;right:18px;top:0}
nav button.ativo{color:var(--branco);border-bottom-color:var(--amarelo)}
nav button:hover{color:var(--branco)}
main{padding:18px;flex:1;max-width:1200px;width:100%;margin:0 auto}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.painel{background:var(--painel);border:1px solid var(--linha);border-radius:6px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:400;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--linha)}
td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
tr.eu td{background:rgba(245,197,24,.12)}
tr.clic{cursor:pointer}tr.clic:hover td{background:rgba(255,255,255,.05)}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-family:var(--fd);font-weight:700;font-size:12px;padding:1px 6px;border-radius:3px;background:var(--linha);color:var(--branco);min-width:34px;text-align:center}
.tag.GOL{background:#7a4b00}.tag.ZAG{background:#1d4e89}.tag.LAT{background:#2a6fb0}.tag.VOL{background:#3d6b2f}.tag.MEI{background:#5b8a3a}.tag.ATA{background:#9c2f2f}
.forca{font-family:var(--fd);font-weight:700;font-size:16px}
.f1{color:var(--muted)}.f2{color:var(--branco)}.f3{color:#7ee081}.f4{color:var(--amarelo)}
.cor{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid rgba(255,255,255,.3)}
.escudo{border:2px solid rgba(255,255,255,.35)}
.escudo-svg{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none}.escudo-svg svg{display:block;width:100%;height:100%}
/* menu */
.menu{max-width:900px;margin:40px auto}
.menu h1{font-size:64px;color:var(--amarelo);letter-spacing:1px}
.menu p{color:var(--muted);max-width:60ch}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.tcard{background:var(--painel);border:1px solid var(--linha);border-radius:6px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tcard:hover{border-color:var(--amarelo)}
.tcard .escudo{width:30px;height:30px;border-radius:50%;flex:none}
.tcard small{display:block;color:var(--muted)}
/* campo */
.campo-wrap{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
@media(max-width:760px){.campo-wrap{grid-template-columns:1fr}}
.campo{position:relative;aspect-ratio:3/4;background:repeating-linear-gradient(0deg,var(--grama) 0 12.5%,var(--grama2) 12.5% 25%);border:2px solid rgba(255,255,255,.55);border-radius:4px;overflow:hidden}
.campo::before,.campo::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.45);z-index:0}
.campo::before{top:-2px;width:60%;height:18%;border-top:0}
.campo::after{bottom:-2px;width:60%;height:18%;border-bottom:0}
.campo .meio{position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(255,255,255,.45);z-index:0}
.campo .circ{position:absolute;top:50%;left:50%;width:24%;aspect-ratio:1;border:2px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%);z-index:0}
.jog{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:72px;z-index:2;pointer-events:auto}
.jog .cam{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.jog .nome{font-size:11px;background:rgba(0,0,0,.55);border-radius:3px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jog.sel .cam{outline:3px solid var(--amarelo);outline-offset:2px}
.jog.fora .nome{color:var(--amarelo)}
.campo-pausa .jog{width:92px}
.campo-pausa .jog .nome{font-size:10px}
.campo-pausa{width:100%;max-width:520px;margin-left:auto;margin-right:auto}
.campo-pausa .jog .nome{max-width:100px}
.campo-pausa .jog .posicao{display:block;max-width:100px;margin:1px auto 0;background:rgba(0,0,0,.72);border-radius:2px;color:var(--amarelo);font-family:var(--fd);font-size:10px;font-weight:700;line-height:13px}
.campo-pausa .jog.lesionado .cam{outline:3px solid var(--vermelho);outline-offset:2px}
.campo-pausa .jog.lesionado .nome{color:#ff9385;font-weight:700}
.banco-pausa{background:rgba(255,255,255,.04);border-top:1px solid var(--linha);padding:10px 0 2px}
.banco-pausa h4{margin:0 0 8px;color:var(--branco);font-family:var(--fd);font-size:16px}
.banco-pausa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,180px));justify-content:center;gap:6px}
.banco-pausa-grupo{margin-top:10px;padding-top:7px;border-top:1px solid var(--linha)}
.banco-pausa-grupo:first-child{margin-top:0;border-top:0}
.banco-pausa-grupo h5{margin:0 0 5px;color:var(--muted);font-family:var(--fd);font-size:13px;text-transform:uppercase}
.reserva-pausa{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:7px;width:100%;min-height:48px;text-align:left;padding:5px 7px;background:var(--painel);border-color:var(--linha)}
.reserva-pausa:hover,.reserva-pausa.sel{background:rgba(245,197,24,.16);border-color:var(--amarelo)}
.reserva-pausa .mini-cam{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;border:1px solid rgba(255,255,255,.6)}
.reserva-pausa .reserva-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.reserva-pausa .reserva-pos{display:block;color:var(--muted);font-size:10px}
.reserva-pausa .reserva-forca{font-family:var(--fd);font-size:17px;font-weight:700}
.banco tr.sel td{background:rgba(245,197,24,.25)}
.taticas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* partida */
.placar{background:linear-gradient(180deg,#153428,#0f2a20);border:1px solid var(--linha);border-radius:6px;padding:14px 18px}
.placar .linha1{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.placar .tempo{height:8px;background:var(--board);border-radius:4px;overflow:hidden;width:160px}
.placar .tempo i{display:block;height:100%;background:var(--amarelo)}
.placar .linha2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:10px 0}
.placar .time{font-family:var(--fd);font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.placar .time.d{justify-content:flex-end;text-align:right}
.placar .gols{font-family:var(--fd);font-size:56px;font-weight:700;line-height:1;background:var(--board);padding:2px 18px;border-radius:6px;min-width:150px;text-align:center}
.stat{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.stat .bar{height:6px;background:var(--board);border-radius:3px;overflow:hidden;display:flex}
.stat .bar i{display:block;height:100%}
.stat .bar i:first-child{background:var(--amarelo)}.stat .bar i:last-child{background:var(--azul);margin-left:auto}
.eventos{max-height:200px;overflow:auto;font-size:13px}
.eventos div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.jogos td{padding:4px 6px}
.jogos .plc{font-family:var(--fd);font-weight:700;font-size:16px;text-align:center;background:var(--board);border-radius:3px;padding:0 6px}
.jogos tr.eu td{background:rgba(245,197,24,.12)}
.controles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.aviso{background:rgba(224,83,63,.15);border:1px solid var(--vermelho);padding:8px 12px;border-radius:4px;margin:10px 0}
.ok{background:rgba(126,224,129,.12);border:1px solid #7ee081;padding:8px 12px;border-radius:4px;margin:10px 0}
.noticias div{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.noticias small{color:var(--muted);margin-right:8px;font-family:var(--fd)}
.res{font-family:var(--fd);font-weight:700;padding:1px 6px;border-radius:3px;font-size:13px;min-width:22px;display:inline-block;text-align:center}
.res.V{background:#2f7a35}.res.E{background:#666}.res.D{background:#8d2c2c}
/* calendário */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
@media(max-width:800px){.cal-grid{grid-template-columns:repeat(4,1fr)}}
.cal-dia{background:var(--board);border:1px solid var(--linha);border-radius:6px;padding:6px;min-height:74px}
.cal-dia.atual{border-color:var(--amarelo)}
.cal-dia .cal-num{display:flex;justify-content:space-between;font-family:var(--fd);font-size:11px;color:var(--muted);margin-bottom:3px}
.cal-evento{font-size:11px;padding:2px 5px;border-radius:3px;margin-top:3px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-evento.camp{background:rgba(126,224,129,.15);border-color:#7ee081}
.cal-evento.copa{background:rgba(245,197,24,.15);border-color:var(--amarelo)}
.cal-evento.cont{background:rgba(74,163,223,.15);border-color:var(--azul)}
.cal-vazio{font-size:11px}
.cal-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cal-dot.camp{background:#7ee081}.cal-dot.copa{background:var(--amarelo)}.cal-dot.cont{background:var(--azul)}
/* mobile */
@media(max-width:560px){
  main{padding:12px}
  h2{font-size:20px}
  header{flex-wrap:wrap;gap:8px 14px;padding:10px 14px}
  header .stats{margin-left:0;flex:1 1 100%;justify-content:space-between;gap:8px;text-align:left}
  header .stats .num{font-size:18px}
  nav{padding:0 8px}
  nav button{padding:8px 10px;font-size:14px}
  .menu{margin:24px auto}
  .menu h1{font-size:38px}
  .placar{padding:10px 12px}
  .placar .linha1{font-size:11px}
  .placar .tempo{width:80px}
  .placar .time{font-size:16px;gap:6px}
  .placar .gols{font-size:28px;min-width:76px;padding:2px 8px}
  .jog{width:54px}
  .jog .cam{width:26px;height:26px;font-size:11px}
  .jog .nome{font-size:9px}
  .cal-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="motor.js"></script>
<script>
/* ============ MOTOR (dados, geração de mundo e simulação) ============
   Tudo isso agora mora em motor.js, sem depender de tela nem localStorage
   — é o que a Fase 1 do plano de multiplayer vai reaproveitar no servidor.
   Aqui só religamos os nomes de sempre a essa nova peça, injetando o
   `state` deste navegador, pra não precisar tocar no resto do arquivo. */
const {FORMACOES, ESTILOS, CONF_NOME, CONFEDERACOES, POSICOES, TV, TREINOS, STAFF_NOMES,
  STAFF_DESC, TIPOS_FALTA, TIPOS_PENALTI, TIMES_BASE, TIMES_MUNDO, RODADAS_TEMPORADA,
  diaDaRodada, FASES_COPA, rnd, pick, clamp, fmt, rivalDe} = Motor;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ ESTADO ============ */
let state=null;
let ui={tela:'menu',sel:null,filtroPos:'',filtroConf:'',filtroIdadeMax:'',filtroValorMax:'',partida:null,clubeVisto:null,menuConf:'SA',menuDiv:'A',vendaPendente:null};

/* Wrappers finos: religam os nomes de sempre às funções equivalentes do motor.js,
   injetando o `state` deste navegador. As telas e os controllers abaixo continuam
   chamando esses nomes exatamente como antes — só a implementação mudou de arquivo. */
function noticia(txt){Motor.noticia(state,txt);}
function novoJogo(idMeu){state=Motor.novoJogo(idMeu);salvar();}
function autoEscalar(t){return Motor.autoEscalar(state,t);}
function emCampo(t){return Motor.emCampo(state,t);}
function forcaTime(t,mando){return Motor.forcaTime(state,t,mando);}
function criarPartida(g,acresc1,acresc2){return Motor.criarPartida(state,g,acresc1,acresc2);}
function simularJogoCopa(a,b){return Motor.simularJogoCopa(state,a,b);}
function jogarTorneio(torneio,premio,tituloNome){Motor.jogarTorneio(state,torneio,premio,tituloNome);salvar();render();}
function gerarCopa(){return Motor.gerarCopa(state);}
function gerarTorneiosContinentais(){return Motor.gerarTorneiosContinentais(state);}
function ofertasEmprego(){return Motor.gerarOfertasEmprego(state);}
function tabela(conf,div){return Motor.tabela(state,conf,div);}
function posicao(id){return Motor.posicao(state,id);}
function resumoTemporada(conf){return Motor.resumoTemporada(state,conf);}
function transferir(j,de,para,preco){return Motor.transferir(state,j,de,para,preco);}
function rodadaAtual(){return Motor.rodadaAtual(state);}
function novaTemporada(){Motor.novaTemporada(state);salvar();ui.tela='inicio';render();}
function concluirRodada(){Motor.concluirRodada(state);salvar();}
function hooksPartida(){
  return {
    interativo:timeId=>timeId===state.meuTime&&podeInteragir(),
    onPenalti:(p,l,t)=>ativarCobranca(p,l,t,'penalti'),
    onFalta:(p,l,t)=>ativarCobranca(p,l,t,'falta'),
    onLesao:(p,l,t,jogador)=>forcarSubstituicao(jogador.id),
  };
}
function minuto(p){return Motor.minuto(state,p,hooksPartida());}

function jogarTorneioAoVivo(torneio,premio,tituloNome){
  if(!torneio||torneio.campeao!=null||!torneio.jogos.length||state.rodada<torneio.rodadaAlvo)return;
  const m=meu();
  const idx=torneio.jogos.findIndex(g=>g.a===m.id||g.b===m.id);
  if(idx<0){jogarTorneio(torneio,premio,tituloNome);return;}
  iniciarPartidaCopa(torneio,idx,premio,tituloNome);
}
function iniciarPartidaCopa(torneio,idx,premio,tituloNome){
  const m=meu();
  if(m.titulares.some(id=>J(id).suspenso>0||J(id).lesao>0||J(id).selecao>0)){autoEscalar(m);noticia('Jogador suspenso, lesionado ou convocado foi retirado da escalação automaticamente.');}
  const meuJogo=torneio.jogos[idx];
  const outrosResultados=torneio.jogos.map((g,i)=>i===idx?null:simularJogoCopa(g.a,g.b));
  const minhaPartida=criarPartida({casa:meuJogo.a,fora:meuJogo.b,gc:null,gf:null,eventos:[]});
  ui.partida={jogos:{A:[minhaPartida],B:[],C:[],D:[]},timer:null,vel:1,pausado:false,subsUsadas:0,intervaloFeito:false,subForcada:null,
    copa:{torneio,premio,tituloNome,idx,meuJogo,outrosResultados}};
  ui.tela='partida';render();
  setVelocidade(1);
}
function concluirPartidaCopa(){
  const p=ui.partida,c=p.copa,jogo=p.jogos.A[0];
  let vencedor,penaltis=null;
  if(jogo.gc===jogo.gf){
    vencedor=Math.random()<jogo.H.ata/(jogo.H.ata+jogo.A.ata)?c.meuJogo.a:c.meuJogo.b;
    const pv=rnd(3,5),pp=rnd(Math.max(0,pv-3),pv-1);
    penaltis=vencedor===c.meuJogo.a?(pv+'x'+pp):(pp+'x'+pv);
  }else vencedor=jogo.gc>jogo.gf?c.meuJogo.a:c.meuJogo.b;
  const meuResultado={a:c.meuJogo.a,b:c.meuJogo.b,gc:jogo.gc,gf:jogo.gf,vencedor,penaltis};
  const resultados=c.outrosResultados.map((r,i)=>i===c.idx?meuResultado:r);
  const torneio=c.torneio,m=meu(),faseAntes=torneio.fase;
  torneio.historico.push({fase:faseAntes,rodada:state.rodada+1,resultados});
  resultados.forEach(r=>{
    const placar=r.gc+' x '+r.gf+(r.penaltis?' (pên. '+r.penaltis+')':'');
    if(r.a===m.id||r.b===m.id)noticia((r.vencedor===m.id?'Você avançou! ':'Você foi eliminado. ')+'['+c.tituloNome+'] '+state.times[r.a].nome+' '+placar+' '+state.times[r.b].nome+'.');
    else if(state.times[r.a].conf===m.conf||state.times[r.b].conf===m.conf)noticia('['+c.tituloNome+'] '+faseAntes+': '+state.times[r.a].nome+' '+placar+' '+state.times[r.b].nome+'.');
  });
  const vencedores=resultados.map(r=>r.vencedor);
  if(vencedores.length===1){
    torneio.campeao=vencedores[0];torneio.jogos=[];
    if(torneio.campeao===m.id){m.caixa+=c.premio;state.titulos.push(c.tituloNome+' '+state.temporada);noticia('🏆 CAMPEÃO — '+c.tituloNome+'! Prêmio de '+fmt(c.premio)+' creditado.');}
  }else{
    const prox=[];for(let i=0;i<vencedores.length;i+=2)prox.push({a:vencedores[i],b:vencedores[i+1]});
    torneio.jogos=prox;torneio.fase=FASES_COPA[prox.length]||'Fase final';torneio.rodadaAlvo=Math.min(state.rodada+4,RODADAS_TEMPORADA-1);
  }
  salvar();render();
}
function jogarRodadaCopa(){jogarTorneioAoVivo(state.copa,4e6,'Copa Nacional — '+CONF_NOME[meu().conf]);}
function jogarTorneioContinental(){jogarTorneioAoVivo(state.continentais[meu().conf],7e6,'Copa Continental — '+CONF_NOME[meu().conf]);}
const meu=()=>state.times[state.meuTime];
const J=id=>state.jogadores[id];

/* ============ CAMPO (geometria de tela) ============ */
function coords(form){const linhas=form.split('-').map(Number),n=linhas.length,p=[{x:50,y:90}];
  linhas.forEach((k,i)=>{const y=74-i*(56/(n-1));for(let j=0;j<k;j++)p.push({x:100/(k+1)*(j+1),y});});return p;}

/* ============ PARTIDA AO VIVO (interface) ============ */
function podeInteragir(){return ui.tela==='partida'&&ui.partida&&ui.partida.vel!==0&&!ui.partida.cobranca;}
function ativarCobranca(p,l,t,tipo){
  ui.partida.cobranca={p,l,timeId:t.id,tipo,batedor:null};
  clearInterval(ui.partida.timer);render();
}
function forcarSubstituicao(jogadorId){
  ui.partida.subForcada=jogadorId;ui.partida.pausado=true;
  clearInterval(ui.partida.timer);render();
}
function iniciarRodada(){
  Motor.prepararRodada(state);
  const r=rodadaAtual();
  // Acréscimos sorteados uma vez pra rodada inteira (não por jogo) — os quatro grupos
  // (A/B/C/D) ticam juntos num timer só, então precisam ficar em lockstep pra "todo mundo
  // acabou"/"todo mundo no intervalo" continuarem valendo como proxy confiável.
  const acresc1=rnd(1,4),acresc2=rnd(2,6);
  const cp=g=>criarPartida(g,acresc1,acresc2);
  ui.partida={jogos:{A:r.A.map(cp),B:r.B.map(cp),C:r.C.map(cp),D:r.D.map(cp)},timer:null,vel:1,pausado:false,subsUsadas:0,intervaloFeito:false,subForcada:null};
  ui.tela='partida';render();
  setVelocidade(1);
}
function todosJogos(p){return [...p.jogos.A,...p.jogos.B,...p.jogos.C,...p.jogos.D];}
function setVelocidade(v){
  const p=ui.partida;p.vel=v;p.pausado=false;p.cobranca=null;clearInterval(p.timer);
  const tick=()=>{todosJogos(p).forEach(minuto);
    if(p.jogos.A[0].fim){clearInterval(p.timer);if(p.copa)concluirPartidaCopa();else concluirRodada();}
    else if(p.cobranca){clearInterval(p.timer);}
    else if(p.jogos.A[0].min===45+(p.jogos.A[0].acresc1||0)&&!p.intervaloFeito){p.intervaloFeito=true;p.pausado=true;clearInterval(p.timer);}
    render();};
  if(v===0){while(!p.jogos.A[0].fim)todosJogos(p).forEach(minuto);if(p.copa)concluirPartidaCopa();else concluirRodada();render();}
  else p.timer=setInterval(tick,v===1?500:260);
}
function pausarPartida(){const p=ui.partida;clearInterval(p.timer);p.pausado=true;render();}
function retomarPartida(){setVelocidade(ui.partida.vel||1);}
function pmAtual(){const p=ui.partida,m=meu();return todosJogos(p).find(x=>x.g.casa===m.id||x.g.fora===m.id);}
function recalcularForcaPartida(){
  const m=meu(),pm=pmAtual(),mandante=pm.g.casa===m.id;
  if(mandante)pm.H=Motor.forcaTimeAoVivo(state,pm,m,true);else pm.A=Motor.forcaTimeAoVivo(state,pm,m,false);
}
function ativarAtaqueTotal(){
  const m=meu(),pm=pmAtual();
  if(!Motor.podeAtaqueTotal(pm,m))return;
  Motor.ativarAtaqueTotal(state,pm,m);
  noticia('🔥 '+m.nome+' vai com tudo pro ataque nos minutos finais!');
  salvar();render();
}
function mudarEstiloPartida(e){meu().estilo=e;recalcularForcaPartida();salvar();render();}
function clicarPartida(id){
  const p=ui.partida;if(!p||!p.pausado)return;
  const m=meu();
  if(ui.sel===null||ui.sel===id){ui.sel=ui.sel===id?null:id;render();return;}
  const a=ui.sel,b=id,ia=m.titulares.indexOf(a),ib=m.titulares.indexOf(b);
  if(ia>=0&&ib>=0){
    if(J(a).suspenso||J(b).suspenso){alert('Jogador expulso não pode trocar de posição — o time joga com um a menos.');ui.sel=null;render();return;}
    m.titulares[ia]=b;m.titulares[ib]=a;
  }else if(ia>=0||ib>=0){
    const entra=ia>=0?b:a,sai=ia>=0?a:b;
    if(J(sai).suspenso){alert('Jogador expulso não pode ser substituído — o time joga com um a menos.');ui.sel=null;render();return;}
    if(J(entra).suspenso||J(entra).lesao||J(entra).selecao){alert('Jogador indisponível.');ui.sel=null;render();return;}
    if((p.subsUsadas||0)>=5){alert('Limite de 5 substituições atingido.');ui.sel=null;render();return;}
    if(ia>=0)m.titulares[ia]=b;else m.titulares[ib]=a;
    p.subsUsadas=(p.subsUsadas||0)+1;
    noticia('Substituição: '+J(entra).nome+' entra no lugar de '+J(sai).nome+'.');
    if(p.subForcada===sai)p.subForcada=null;
  }else{ui.sel=null;render();return;}
  ui.sel=null;recalcularForcaPartida();salvar();render();
}
function escolherBatedor(id){ui.partida.cobranca.batedor=id;render();}
function cobrar(tipoKey){
  const c=ui.partida.cobranca,p=c.p;
  Motor.resolverCobranca(state,c,tipoKey);
  ui.partida.cobranca=null;
  render();salvar();
  if(!p.fim)retomarPartida();
}
function painelCobranca(){
  const c=ui.partida.cobranca,t=state.times[c.timeId];
  const elegiveis=emCampo(t).sort((a,b)=>b.forca-a.forca);
  if(c.batedor===null){
    return `<div class="painel" style="margin:12px 0;border-color:var(--amarelo)"><h3>${c.tipo==='penalti'?'🎯 Pênalti a favor!':'⚡ Falta perigosa!'}</h3>
    <p class="muted">Escolha quem vai cobrar:</p>
    <div class="taticas">${elegiveis.map(j=>`<button onclick="escolherBatedor(${j.id})">${esc(j.nome)} <span class="muted">(${j.pos} ${j.forca})</span></button>`).join('')}</div></div>`;
  }
  const tipos=c.tipo==='penalti'?TIPOS_PENALTI:TIPOS_FALTA;
  return `<div class="painel" style="margin:12px 0;border-color:var(--amarelo)"><h3>${esc(J(c.batedor).nome)} vai cobrar. Como?</h3>
  <div class="taticas">${Object.entries(tipos).map(([k,v])=>`<button onclick="cobrar('${k}')" title="${esc(v.desc)}">${v.nome}</button>`).join('')}</div>
  <p class="muted" style="margin-top:6px">Passe o mouse nos botões pra ver a descrição de cada cobrança.</p></div>`;
}
function liberarSemSubstituir(){ui.partida.subForcada=null;render();}
function mudarFormacaoPausa(f){const m=meu();m.formacao=f;recalcularForcaPartida();salvar();render();}
function jogadorForcado(){const p=ui.partida,m=meu();return p.subForcada&&m.titulares.includes(p.subForcada)?J(p.subForcada):null;}
function campoPausa(m){
  const slots=Motor.formacaoDoClube(state,m),custom=(m.formacoesCustom||[]).find(f=>m.formacao==='custom:'+f.id),c=custom&&custom.coords&&custom.coords.length===11?custom.coords:coords(custom?'4-4-2':m.formacao);
  const forcado=jogadorForcado();
  return `<div class="campo campo-pausa"><div class="meio"></div><div class="circ"></div>${m.titulares.map((id,i)=>{const j=J(id),lesionado=forcado&&forcado.id===id;return `<div class="jog ${ui.sel===id?'sel':''} ${lesionado?'lesionado':''}" style="left:${c[i].x}%;top:${c[i].y}%" onclick="clicarPartida(${id})" title="${lesionado?'LESIONADO — substituição obrigatória. ':''}${esc(j.nome)} | Posição: ${j.pos}"><div class="cam" style="background:${m.cor1};color:${m.cor2}">${j.forca}</div><div class="nome">${lesionado?'🚑 ':''}${esc(j.nome)}</div><div class="posicao">${j.pos}</div></div>`;}).join('')}</div>`;
}
function painelSubstituicao(m){
  const banco=m.jogadores.map(J).filter(j=>!m.titulares.includes(j.id)&&!j.suspenso&&!j.lesao&&!j.selecao).sort((a,b)=>b.forca-a.forca);
  const reserva=j=>`<button class="reserva-pausa ${ui.sel===j.id?'sel':''}" onclick="clicarPartida(${j.id})"><span class="mini-cam" style="background:${m.cor1};color:${m.cor2}">${j.forca}</span><span class="reserva-nome">${esc(j.nome)}<small class="reserva-pos">${j.pos} · ${j.idade} anos</small></span><b class="reserva-forca ${classeForca(j.forca)}">${j.forca}</b></button>`;
  const grupos=[['Goleiros',['GOL']],['Zagueiros e laterais',['ZAG','LAT']],['Meio-campos',['VOL','MEI']],['Atacantes',['ATA']]];
  const forcado=jogadorForcado();
  return `<div class="painel" style="margin:12px 0;${forcado?'border-color:var(--vermelho)':''}">
  ${forcado?`<div class="aviso">🚑 Substituição obrigatória: <b>${esc(forcado.nome)}</b> está lesionado e precisa sair.${banco.length?'':' Não há ninguém disponível no banco — o time vai jogar com um a menos.'}</div>`:''}
  <label>Formação durante a partida <select onchange="mudarFormacaoPausa(this.value)"><optgroup label="Formações prontas">${Object.keys(FORMACOES).map(f=>`<option value="${f}" ${f===m.formacao?'selected':''}>${f}</option>`).join('')}</optgroup>${(m.formacoesCustom||[]).length?`<optgroup label="Minhas formações">${m.formacoesCustom.map(f=>`<option value="custom:${f.id}" ${m.formacao==='custom:'+f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</optgroup>`:''}</select></label>
  <h3>Substituições — ${5-(ui.partida.subsUsadas||0)} restantes</h3>
  <div style="width:100%;max-width:540px;margin:0 auto 14px">${campoPausa(m)}</div>
  <div class="banco-pausa"><h4>Banco de reservas</h4>${grupos.map(([nome,pos])=>{const lista=banco.filter(j=>pos.includes(j.pos));return lista.length?`<section class="banco-pausa-grupo"><h5>${nome}</h5><div class="banco-pausa-grid">${lista.map(reserva).join('')}</div></section>`:''}).join('')||'<p class="muted">Sem opções no banco.</p>'}</div>
  <p class="muted" style="margin-top:6px">Clique em um jogador do campo e depois em uma opção do banco. [POS] indica a posição.</p>
  ${forcado&&!banco.length?`<button style="margin-top:8px" onclick="liberarSemSubstituir()">Continuar com o time reduzido</button>`:''}
  </div>`;
}
function resolverPedido(aceitar){
  const ped=state.pedidoPendente;if(!ped)return;
  const j=J(ped.jogadorId);
  if(aceitar){j.salario+=ped.aumento;j.moral=clamp(j.moral+20,0,100);noticia('Você aceitou o pedido de aumento de '+j.nome+'.');}
  else{j.moral=clamp(j.moral-15,0,100);noticia(j.nome+' ficou insatisfeito após a recusa do pedido de aumento.');}
  state.pedidoPendente=null;salvar();render();
}

  const ped=state.pedidoPendente;if(!ped)return'';
  const j=J(ped.jogadorId);

/* Antes era resolvida com confirm() dentro de ofertaRecebida(); agora é um painel, igual
   ao pedido de aumento acima — necessário pra concluirRodada() poder rodar sem um humano
   no teclado (ver motor.js). */
function resolverOferta(aceitar){
  const of=state.ofertaPendente;if(!of)return;
  const j=J(of.jogadorId),comp=state.times[of.compradorId];
  if(aceitar){transferir(j,meu(),comp,of.oferta);noticia(j.nome+' vendido ao '+comp.nome+' por '+fmt(of.oferta)+' (oferta recebida).');}
  else noticia(comp.nome+' propôs '+fmt(of.oferta)+' por '+j.nome+', mas você recusou.');
  state.ofertaPendente=null;salvar();render();
}
function painelOferta(){
  const of=state.ofertaPendente;if(!of)return'';
  const j=J(of.jogadorId),comp=state.times[of.compradorId];
  return `<div class="painel" style="border-color:var(--amarelo);margin-bottom:18px"><h3>💰 Oferta recebida</h3>
  <p>${esc(comp.nome)} oferece <b>${fmt(of.oferta)}</b> por <b>${esc(j.nome)}</b>${estrelaTag(j.forca)}.</p>
  <table style="margin:8px 0"><tr><td>Posição</td><td class="r"><span class="tag ${j.pos}">${j.pos}</span></td></tr>
  <tr><td>Força</td><td class="r"><span class="forca ${classeForca(j.forca)}">${j.forca}</span></td></tr>
  <tr><td>Valor de mercado</td><td class="r">${fmt(j.valor)}</td></tr></table>
  <button class="primario" onclick="resolverOferta(true)">Aceitar</button> <button onclick="resolverOferta(false)">Recusar</button></div>`;
}

/* ============ SAVE ============ */
// Cada partida agora tem nome e id próprios (craque_manager_save_<id>), com um índice
// (craque_manager_saves) listando {id,nome,criadoEm} — antes era um slot único fixo.
const KEY_INDICE='craque_manager_saves';
let saveAtualId=null;
function chaveSave(id){return 'craque_manager_save_'+id;}
function listarSaves(){try{return JSON.parse(localStorage.getItem(KEY_INDICE)||'[]');}catch(e){return[];}}
function salvarIndice(lista){try{localStorage.setItem(KEY_INDICE,JSON.stringify(lista));}catch(e){}}
function salvar(){if(!saveAtualId)return;try{localStorage.setItem(chaveSave(saveAtualId),JSON.stringify(state));}catch(e){}}
function migrarSave(st){
    if(!st.versaoMundo||st.versaoMundo<2)return null;
  Motor.garantirNomesClubes(st.times);
    st.times.forEach(t=>{if(!t.treino)t.treino={passe:0,falta:0,penalti:0,fisico:0};
      if(!t.staff)t.staff={fisico:0,goleiro:0,olheiro:0};
      if(t.capacidade===undefined)t.capacidade=Math.round(t.torcida*1.15);
      if(t.patrocinio===undefined)t.patrocinio=0;});
    if(st.diasParaJogo===undefined)st.diasParaJogo=0;
    if(st.dia===undefined)st.dia=diaDaRodada(st.rodada-1)||0;
    if(!st.copa)st.copa={jogos:[],fase:'-',rodadaAlvo:st.rodada+4,campeao:null,historico:[]};
    if(st.rivalId===undefined){st.rivalId=rivalDe(st.meuTime);st.classico={v:0,e:0,d:0};}
    st.classicos=Motor.gerarClassicos(st.times);st.rivalId=Motor.rivalDoEstado(st,st.meuTime);
    if(st.pedidoPendente===undefined)st.pedidoPendente=null;
    if(st.ofertaPendente===undefined)st.ofertaPendente=null;
    if(!st.janela)st.janela={aberta:true,dias:10,meioAberta:true};
    if(!st.continentais){st.continentais={};CONFEDERACOES.forEach(c=>{st.continentais[c]={jogos:[],fase:'-',rodadaAlvo:st.rodada+3,campeao:null,historico:[]};});}
    if(st.mundial===undefined)st.mundial=null;
    if(!st.premiosTemporada)st.premiosTemporada=[];
    if(!st.tecnico)st.tecnico={nome:'Treinador',reputacao:50,status:'empregado',historico:[]};
    if(!st.tecnico.historico)st.tecnico.historico=[];
    if(!st.tecnico.conquistas)st.tecnico.conquistas=[];
    if(!st.tecnico.clubes)st.tecnico.clubes=[];
    if(st.tecnico.temporadas===undefined)st.tecnico.temporadas=0;
    ['jogos','vitorias','empates','derrotas','golsPro','golsContra','titulos'].forEach(k=>{if(st.tecnico[k]===undefined)st.tecnico[k]=0;});
    if(!st.tecnico.trofeus)st.tecnico.trofeus=[];
    if(st.tecnico.reputacao===undefined)st.tecnico.reputacao=50;
    if(!st.tecnico.status)st.tecnico.status='empregado';
    if(!st.ofertasEmprego)st.ofertasEmprego=[];
    Object.values(st.jogadores).forEach(j=>{if(j.energia===undefined)j.energia=100;if(!j.perna)j.perna='D';if(!j.atributos)j.atributos=Motor.ATRIBUTOS_BASE.reduce((a,n)=>(a[n]=j.forca,a),{});if(!j.caracteristicas)j.caracteristicas=[];if(j.notaAtual===undefined)j.notaAtual=null;if(j.mediaUltimaTemporada===undefined)j.mediaUltimaTemporada=null;if(!j.notasTemporada)j.notasTemporada={soma:0,jogos:0};if(!j.notas)j.notas=[];});
    Object.values(st.jogadores).forEach(j=>{if(j.assistencias===undefined)j.assistencias=0;});
    st.times.forEach(t=>{if(t.baseNivel===undefined)t.baseNivel=0;if(!t.prospectos)t.prospectos=[];if(t.pontosTreino===undefined)t.pontosTreino=Motor.TREINO_PONTOS_POR_RODADA;
      if(!t.setores)t.setores=Motor.criarSetoresIniciais(t.capacidade);
      if(!t.socios)t.socios={ativos:Math.round(t.torcida*.1),mensalidade:40};
      if(t.patrocinioContrato===undefined)t.patrocinioContrato=t.patrocinio>0?{empresa:pick(Motor.EMPRESAS_PATROCINIO),duracaoRestante:rnd(1,3)}:null;
      if(!t.financas)t.financas=(t.id===st.meuTime&&st.financas)?st.financas:[];});
    Object.values(st.jogadores).forEach(j=>{if(j.emBase===undefined)j.emBase=false;});
    Object.values(st.jogadores).forEach(j=>{if(j.lesao===undefined){j.lesao=0;j.lesaoTipo='';}
      if(j.contrato===undefined)j.contrato=rnd(1,4);
      if(j.selecao===undefined)j.selecao=0;
      if(j.lesoesTotal===undefined){j.lesoesTotal=0;j.fragil=false;}
      if(j.potencial===undefined)j.potencial=j.idade<=23?clamp(j.forca+rnd(5,25),40,96):j.forca;
      if(!j.dna){j.personalidade=Motor.pickPersonalidade();j.dna=Motor.gerarDNA(j.personalidade);}
      if(!j.carreira)j.carreira={jogos:0,gols:0,assistencias:0,titulos:0,classicos:0,temporadasClube:0};
      if(!j.historico)j.historico=[];});
    st.times.forEach(t=>{if(!t.idolos)t.idolos=[];if(!t.formacoesCustom)t.formacoesCustom=[];if(!t.escudo)t.escudo=Motor.gerarEscudo(t);Motor.garantirLaterais(st,t);});
    return st;}
/* Nunca deixa uma migração quebrada apagar ou sobrescrever o save de verdade: o JSON cru
   original fica intacto em localStorage até o jogador salvar de novo por cima (salvar()
   só grava quando chamado); aqui, antes de devolver o state migrado, guardamos uma cópia
   crua de segurança (1 por save, sobrescrita a cada carregamento) — se uma mudança futura
   no formato dos dados quebrar a migração de um jeito que só aparece depois de já ter
   salvo por cima, ainda dá pra recuperar o estado de antes da migração a partir dela. */
function chaveBackup(id){return 'craque_manager_backup_'+id;}
function carregarSave(id){
  try{
    const s=localStorage.getItem(chaveSave(id));if(!s)return null;
    try{localStorage.setItem(chaveBackup(id),s);}catch(e){}
    const st=migrarSave(JSON.parse(s));if(st)saveAtualId=id;return st;
  }catch(e){console.error('Falha ao carregar/migrar save '+id+':',e);return null;}
}
/* Mensagem certa pra quando "Continuar" falha — nunca manda apagar por padrão. Distingue
   os 3 motivos possíveis: save realmente velho demais pro formato atual (o único caso em
   que apagar faz sentido), JSON ilegível de verdade, ou (o mais comum se isso aparecer do
   nada) um bug numa migração — nesse caso os dados continuam intactos no localStorage,
   só não sabemos ler ainda, e apagar seria perder progresso por um bug meu, não do save. */
function diagnosticoSave(id){
  try{
    const s=localStorage.getItem(chaveSave(id));
    if(!s)return 'Não encontrei os dados dessa partida no navegador.';
    const raw=JSON.parse(s);
    if(!raw.versaoMundo||raw.versaoMundo<2)return 'Essa partida é de uma versão muito antiga do jogo e não é mais compatível. Esse é o único caso em que dá pra apagar sem perder nada recuperável.';
    return 'Não consegui abrir essa partida — parece um bug ao carregar (não é culpa do seu save). NÃO apague: os dados continuam salvos no navegador. Abra o console (F12) pra ver o erro técnico e me avise pra eu corrigir a migração.';
  }catch(e){return 'O arquivo salvo dessa partida está com o JSON corrompido (não dá nem pra ler a estrutura). Ainda assim, evite apagar até ter certeza — dá pra tentar recuperar copiando o valor de "'+chaveSave(id)+'" do localStorage antes.';}
}
function temBackupSave(id){try{return !!localStorage.getItem(chaveBackup(id));}catch(e){return false;}}
function restaurarBackupSave(id){
  if(!confirm('Restaurar essa partida pra como ela estava antes da última tentativa de abrir? Isso substitui o save atual por essa cópia.'))return;
  try{
    const b=localStorage.getItem(chaveBackup(id));
    if(!b){alert('Não achei nenhum backup pra essa partida.');return;}
    localStorage.setItem(chaveSave(id),b);
    alert('Backup restaurado. Clique em Continuar de novo.');
    render();
  }catch(e){alert('Não consegui restaurar: '+e.message);}
}
function iniciarNovoJogo(nome,idTime){

function apagarSave(id){
  if(!confirm('Tem certeza que quer apagar essa partida? Essa ação não pode ser desfeita.'))return;
  try{localStorage.removeItem(chaveSave(id));}catch(e){}
  salvarIndice(listarSaves().filter(s=>s.id!==id));

function celulasCalendario(m){
  const cont=state.continentais[m.conf];
  const cels=[];
  for(let r=0;r<RODADAS_TEMPORADA;r++){
    const eventos=[];
    const g=state.calendario[m.conf][m.div][r].find(x=>x.casa===m.id||x.fora===m.id);
    if(g){const casa=g.casa===m.id,adv=casa?g.fora:g.casa,jogado=g.gc!==null;
      eventos.push({tipo:'camp',casa,adv,resultado:jogado?(casa?g.gc+' x '+g.gf:g.gf+' x '+g.gc):null});}
    if(state.copa&&state.copa.campeao==null&&state.copa.jogos.length&&state.copa.rodadaAlvo===r){
      const jc=state.copa.jogos.find(x=>x.a===m.id||x.b===m.id);
      if(jc)eventos.push({tipo:'copa',casa:jc.a===m.id,adv:jc.a===m.id?jc.b:jc.a,resultado:null});
    }
    if(cont&&cont.campeao==null&&cont.jogos.length&&cont.rodadaAlvo===r){
      const jc=cont.jogos.find(x=>x.a===m.id||x.b===m.id);
      if(jc)eventos.push({tipo:'cont',casa:jc.a===m.id,adv:jc.a===m.id?jc.b:jc.a,resultado:null});
    }
    cels.push({r,dia:diaDaRodada(r),atual:r===state.rodada,eventos});
  }
  return cels;
}

function proporOferta(id){
  if(!state.janela.aberta){alert('A janela de transferências está fechada.');return;}
  const j=J(id),de=state.times[j.time],m=meu();
  if(de.id===m.id){alert('Esse jogador já é seu.');return;}
  if(m.jogadores.length>=25){alert('Elenco no limite de 25 jogadores.');return;}
  if(de.jogadores.length<=11){alert(de.nome+' não pode vender: ficaria sem jogadores suficientes para escalar um time.');return;}
  const sugestao=Math.round(j.valor*1.1/1e4)*1e4;
  const entrada=prompt('Proposta por '+j.nome+' ('+de.nome+'). Valor de mercado: '+fmt(j.valor)+'. Quanto quer oferecer?',sugestao);
  if(entrada===null)return;
  const oferta=Motor.parseValorEntrada(entrada);
  if(!oferta||oferta<=0){alert('Valor inválido.');return;}
  if(m.caixa<oferta){alert('Caixa insuficiente para essa proposta.');return;}
  let minimo=j.valor;
  if(de.titulares.includes(j.id))minimo*=1.4;
  if(de.jogadores.length<=17)minimo*=1.25;
  if(de.caixa<0)minimo*=.85;
  if(oferta>=minimo){
    transferir(j,de,m,oferta);j.moral=80;noticia('Proposta aceita! '+j.nome+' contratado do '+de.nome+' por '+fmt(oferta)+'.');salvar();render();
  }else alert(de.nome+' recusou a proposta. Eles pedem pelo menos '+fmt(Math.round(minimo/1e4)*1e4)+'.');
}

  const m=meu(),info=Motor.SETORES_ESTADIO[setor],s=m.setores[setor];
  const inc=Math.max(100,Math.round(s.lugares*.12/100)*100),custo=inc*900;
  if(m.caixa<custo){alert('Caixa insuficiente para a reforma.');return;}
  if(!confirm('Ampliar o setor '+info.nome+': +'+inc.toLocaleString('pt-BR')+' lugares por '+fmt(custo)+'?'))return;
  m.caixa-=custo;s.lugares+=inc;Motor.recalcularCapacidade(m);
  noticia('Setor '+info.nome+' ampliado — agora '+s.lugares.toLocaleString('pt-BR')+' lugares.');
  salvar();render();
}
function ajustarPrecoSetor(setor,valor){
  const m=meu(),info=Motor.SETORES_ESTADIO[setor];
  const min=Math.round(info.precoBase*.5),max=Math.round(info.precoBase*3);
  const preco=clamp(Math.round(Number(valor)||0),min,max);
  m.setores[setor].preco=preco;salvar();render();
}
function ajustarMensalidadeSocios(valor){
  const m=meu(),mensalidade=clamp(Math.round(Number(valor)||0),10,150);
  m.socios.mensalidade=mensalidade;salvar();render();
}
function buscarPatrocinio(){
  const m=meu(),oferta=Math.round((m.torcida*.6+rnd(5000,20000))/1000)*1000,empresa=pick(Motor.EMPRESAS_PATROCINIO),duracao=rnd(2,4);
  if(!confirm(empresa+' oferece '+fmt(oferta)+' por rodada, contrato de '+duracao+' temporada(s) (substitui o atual, '+fmt(m.patrocinio)+'). Aceitar?'))return;
  m.patrocinio=oferta;m.patrocinioContrato={empresa,duracaoRestante:duracao};
  noticia('Novo patrocínio fechado com '+empresa+': '+fmt(oferta)+' por rodada, por '+duracao+' temporada(s).');salvar();render();
}
function investirBase(){
  const m=meu();
  if(m.baseNivel>=3){alert('Nível máximo já investido.');return;}
  const custo=(m.baseNivel+1)*1.2e6;
  if(m.caixa<custo){alert('Caixa insuficiente.');return;}
  if(!confirm('Investir na categoria de base, nível '+(m.baseNivel+1)+', por '+fmt(custo)+'?'))return;
  m.caixa-=custo;m.baseNivel++;noticia('Categoria de base reforçada: agora nível '+m.baseNivel+'.');
  salvar();render();
}
function contratarStaff(area){
  const m=meu(),nivel=m.staff[area];
  if(nivel>=3){alert('Nível máximo já contratado.');return;}
  const custo=(nivel+1)*1.5e6;
  if(m.caixa<custo){alert('Caixa insuficiente.');return;}
  if(!confirm('Contratar '+STAFF_NOMES[area]+' nível '+(nivel+1)+' por '+fmt(custo)+'?'))return;
  m.caixa-=custo;m.staff[area]++;noticia('Comissão técnica reforçada: '+STAFF_NOMES[area]+' agora nível '+m.staff[area]+'.');
  salvar();render();
}
function telaFinancas(){
  const m=meu(),f=(m.financas||[]).filter(x=>x.t===state.temporada).slice().reverse();
  const folha=m.jogadores.reduce((s,id)=>s+J(id).salario,0);
  const receitaSocios=m.socios.ativos*m.socios.mensalidade;
  return `<div class="grid g2"><div class="painel"><h2>Resumo</h2>
  <table><tr><td>Caixa atual</td><td class="r num ${m.caixa<0?'neg':'pos'}" style="font-size:18px">${fmt(m.caixa)}</td></tr>
  <tr><td>Folha salarial por rodada</td><td class="r">${fmt(folha)}</td></tr>
  <tr><td>Cota de TV por rodada</td><td class="r">${fmt(TV[m.div])}</td></tr>
  <tr><td>Patrocínio por rodada</td><td class="r">${fmt(m.patrocinio)}</td></tr>
  <tr><td>Sócio-torcedor por rodada</td><td class="r">${fmt(receitaSocios)}</td></tr>
  <tr><td>Torcida média</td><td class="r num">${m.torcida.toLocaleString('pt-BR')}</td></tr>
  <tr><td>Capacidade do estádio</td><td class="r num">${m.capacidade.toLocaleString('pt-BR')}</td></tr>
  <tr><td>Público no último jogo em casa</td><td class="r num">${(m.ultimoPublico??0).toLocaleString('pt-BR')}</td></tr>
  <tr><td>Valor do elenco</td><td class="r">${fmt(m.jogadores.reduce((s,id)=>s+J(id).valor,0))}</td></tr></table>
  <p class="muted">Bilheteria só entra em jogos em casa: cada setor tem preço e ocupação próprios — preço mais alto que a referência do setor reduz o público, mais baixo enche o estádio. Se o caixa ficar negativo, venda jogadores.</p></div>
  <div class="painel"><h2>Movimento por rodada</h2><table><tr><th>Rod.</th><th class="r">Bilheteria</th><th class="r">TV</th><th class="r">Patroc.</th><th class="r">Sócios</th><th class="r">Vitória</th><th class="r">Salários</th><th class="r">Caixa</th></tr>
  ${f.map(x=>`<tr><td class="num">${x.r}</td><td class="r pos">${fmt(x.bilheteria)}</td><td class="r pos">${fmt(x.tv)}</td><td class="r pos">${fmt(x.patrocinio||0)}</td><td class="r pos">${fmt(x.socios||0)}</td><td class="r ${x.bonusVitoria?'pos':'muted'}">${x.bonusVitoria?fmt(x.bonusVitoria):'-'}</td><td class="r neg">-${fmt(x.sal)}</td><td class="r num">${fmt(x.caixa)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Nenhuma rodada jogada ainda.</td></tr>'}</table></div>
  <div class="painel" style="grid-column:1/-1"><h2>Estádio — setores</h2>
  <table><tr><th>Setor</th><th class="r">Lugares</th><th class="r">Preço</th><th class="r">Ocupação (último jogo)</th><th></th></tr>
  ${Object.entries(Motor.SETORES_ESTADIO).map(([k,info])=>{const s=m.setores[k],inc=Math.max(100,Math.round(s.lugares*.12/100)*100),custo=inc*900;
    return `<tr><td>${info.nome}</td><td class="r num">${s.lugares.toLocaleString('pt-BR')}</td>
    <td class="r"><input type="number" min="${Math.round(info.precoBase*.5)}" max="${Math.round(info.precoBase*3)}" step="5" value="${s.preco}" style="width:70px;text-align:right" onchange="ajustarPrecoSetor('${k}',this.value)"> <span class="muted" style="font-size:11px">(ref. R$ ${info.precoBase})</span></td>
    <td class="r num">${Math.round(s.ocupacao*100)}%</td>
    <td><button onclick="reformarSetor('${k}')">Ampliar +${inc.toLocaleString('pt-BR')} (${fmt(custo)})</button></td></tr>`;}).join('')}
  </table></div>
  <div class="painel"><h2>Patrocínio</h2>
  ${m.patrocinioContrato?`<p class="muted">Contrato com <b>${esc(m.patrocinioContrato.empresa)}</b>: <b class="num pos">${fmt(m.patrocinio)}</b>/rodada, ${m.patrocinioContrato.duracaoRestante} temporada(s) restante(s). Bônus de desempenho: título paga 3 rodadas extras.</p>`
    :`<p class="muted">Sem patrocinador no momento.</p>`}
  <button onclick="buscarPatrocinio()">Buscar novo patrocinador${m.patrocinioContrato?' (substitui o atual)':''}</button></div>
  <div class="painel"><h2>Sócio-torcedor</h2>
  <p class="muted"><b class="num">${m.socios.ativos.toLocaleString('pt-BR')}</b> sócios ativos, gerando ${fmt(receitaSocios)}/rodada.</p>
  <label>Mensalidade <input type="number" min="10" max="150" step="5" value="${m.socios.mensalidade}" style="width:70px" onchange="ajustarMensalidadeSocios(this.value)"></label>
  <p class="muted" style="margin-top:6px">Mensalidade mais alta rende mais por sócio, mas afasta gente — e o número de sócios vai se ajustando aos poucos a cada rodada.</p></div>
  <div class="painel"><h2>Comissão técnica</h2>
  ${Object.keys(STAFF_NOMES).map(k=>`<div style="margin-bottom:10px"><b>${STAFF_NOMES[k]}</b> — nível ${m.staff[k]}/3<br><span class="muted">${STAFF_DESC[k]}</span><br>
    ${m.staff[k]<3?`<button style="margin-top:4px" onclick="contratarStaff('${k}')">Contratar nível ${m.staff[k]+1} (${fmt((m.staff[k]+1)*1.5e6)})</button>`:'<span class="pos">Nível máximo</span>'}</div>`).join('')}
  </div>
  <div class="painel"><h2>Categoria de base</h2>
  <p class="muted">Nível ${m.baseNivel}/3 — quanto maior, mais chance de revelar garotos e maior o potencial deles. Eles sobem pro elenco principal automaticamente aos 18 anos.</p>
  ${m.baseNivel<3?`<button onclick="investirBase()">Investir nível ${m.baseNivel+1} (${fmt((m.baseNivel+1)*1.2e6)})</button>`:'<span class="pos">Nível máximo</span>'}
  </div></div>`;
}
function telaTecnico(){
  const t=state.tecnico||{},jogos=t.jogos||0,aprov=jogos?Math.round(((t.vitorias||0)*3+(t.empates||0))/(jogos*3)*100):0;
  return `<div class="grid g2"><div class="painel"><h1>${esc(t.nome||'Treinador')}</h1><p class="muted">Hall da carreira</p><div class="grid g2"><div><span class="muted">Aproveitamento</span><b class="num" style="display:block;font-size:28px;color:var(--amarelo)">${aprov}%</b></div><div><span class="muted">Reputação</span><b class="num" style="display:block;font-size:28px">${t.reputacao||50}/100</b></div></div><table style="margin-top:18px"><tr><td>Jogos</td><td class="r num">${jogos}</td></tr><tr><td>Vitórias</td><td class="r num pos">${t.vitorias||0}</td></tr><tr><td>Empates</td><td class="r num">${t.empates||0}</td></tr><tr><td>Derrotas</td><td class="r num neg">${t.derrotas||0}</td></tr><tr><td>Gols pró</td><td class="r num">${t.golsPro||0}</td></tr><tr><td>Gols contra</td><td class="r num">${t.golsContra||0}</td></tr><tr><td>Títulos</td><td class="r num">${t.titulos||0}</td></tr></table></div>
  <div class="painel"><h2>Trofeus</h2>${(t.trofeus||[]).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--linha)"><b>🏆 ${esc(x.nome)}</b><br><span class="muted">${esc(x.competicao)} · ${esc(x.clubeNome)} · temporada ${x.temporada}</span></div>`).join('')||'<p class="muted">Seu primeiro troféu ainda está esperando.</p>'}</div>
  <div class="painel"><h2>Conquistas</h2>${(t.conquistas||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--linha)"><b>🏅 ${esc(x.titulo)}</b><br><span class="muted">${esc(x.descricao)} · temporada ${x.temporada}</span></div>`).join('')||'<p class="muted">As conquistas aparecem conforme sua carreira avança.</p>'}</div>
  <div class="painel"><h2>Histórico de clubes</h2>${(t.historico||[]).map(x=>`<p class="muted">T${x.temporada}: <b>${esc(x.clubeNome)}</b>${x.posicao?` — ${x.posicao}º lugar`:''}${x.troca?' — troca de clube':''}</p>`).join('')||'<p class="muted">Nenhum registro de temporada ainda.</p>'}</div></div>`;
}
function fmtMinutoPartida(pm){
  const a1=pm.acresc1||0;
  if(pm.min>90)return '90+'+(pm.min-90)+"'";
  if(pm.min>45&&pm.min<=45+a1)return '45+'+(pm.min-45)+"'";
  return pm.min+"'";
}
function telaPartida(){
  const p=ui.partida,m=meu();
  const pm=todosJogos(p).find(x=>x.g.casa===m.id||x.g.fora===m.id);
  const H=state.times[pm.g.casa],A=state.times[pm.g.fora],fim=p.jogos.A[0].fim;
  const acresc1=pm.acresc1||0,acresc2=pm.acresc2||0;
  const meuAtaqueTotal=pm.ataqueTotal&&pm.ataqueTotal[m.id];
  const stat=(n,a,b)=>{const t=a+b||1;return `<div class="stat"><span class="num r" style="text-align:right">${Math.round(a)}</span><div class="bar"><i style="width:${a/t*100}%"></i><i style="width:${b/t*100}%"></i></div><span class="num">${Math.round(b)}</span><span></span><span class="muted" style="text-align:center">${n}</span></div>`;};
  // Só o Série do próprio clube — as outras 3 continuam rolando junto (o timer tica todas
  // ao mesmo tempo), só não aparecem mais na tela pra não poluir com jogos que não são seus.
  const lista=d=>`<div class="painel"><h3>Série ${d} — rodada ${state.rodada+1}</h3><table class="jogos">${p.jogos[d].map(x=>`<tr class="${x===pm?'eu':''}"><td class="r">${linhaTime(x.g.casa)}</td><td class="plc">${x.gc} x ${x.gf}</td><td>${linhaTime(x.g.fora)}</td><td class="muted" style="font-size:11px">${x.eventos.filter(e=>e.tipo==='gol').map(e=>e.min+"'").join(' ')}</td></tr>`).join('')}</table></div>`;
  const ehClassico=state.rivalId!=null&&(pm.g.casa===state.rivalId||pm.g.fora===state.rivalId);
  const intervalo=!fim&&p.jogos.A[0].min===45+(p.jogos.A[0].acresc1||0)&&p.intervaloFeito;
  const forcado=jogadorForcado();
  const telaAoFim=p.copa?'calendario':(state.fimTemporada?'temporada':'inicio');
  return `<div class="placar">
    ${p.copa?`<div style="text-align:center;color:var(--amarelo);font-family:var(--fd);font-weight:700;font-size:15px;margin-bottom:6px">🏆 ${esc(p.copa.tituloNome)} — ${esc(p.copa.torneio.fase)}</div>`:''}
    ${ehClassico?'<div style="text-align:center;color:var(--amarelo);font-family:var(--fd);font-weight:700;font-size:15px;margin-bottom:6px">🔥 CLÁSSICO</div>':''}
    ${intervalo?'<div class="ok" style="text-align:center;font-family:var(--fd);font-weight:700;font-size:16px">⏱ INTERVALO — aproveite pra mexer no time</div>':''}
    ${meuAtaqueTotal?'<div class="aviso" style="text-align:center;font-family:var(--fd);font-weight:700">🔥 ATAQUE TOTAL — defesa mais vulnerável, ataque muito mais forte</div>':''}
    <div class="linha1"><span>${pm.min<=45+acresc1?'1º tempo':'2º tempo'}</span><div class="tempo"><i style="width:${Math.min(100,pm.min/(90+acresc2)*100)}%"></i></div><span class="num" style="font-size:18px;color:var(--amarelo)">${fmtMinutoPartida(pm)}</span></div>
    <div class="linha2"><div class="time">${linhaTime(H.id)}</div><div class="gols">${pm.gc} x ${pm.gf}</div><div class="time d">${linhaTime(A.id)}</div></div>
    ${fim?'':`<div class="taticas" style="margin:0 0 10px"><label>Instrução tática <select onchange="mudarEstiloPartida(this.value)">${Object.entries(ESTILOS).map(([k,v])=>`<option value="${k}" ${k===m.estilo?'selected':''}>${v.nome}</option>`).join('')}</select></label>
    ${Motor.podeAtaqueTotal(pm,m)?`<button onclick="ativarAtaqueTotal()">🔥 Ataque total</button>`:''}</div>`}
    <div class="grid g2" style="gap:18px"><div>
      ${stat('posse de bola',pm.posse,100-pm.posse)}${stat('finalizações',pm.fc,pm.ff)}
      ${stat('cartões',pm.eventos.filter(e=>e.lado==='c'&&(e.tipo==='amarelo'||e.tipo==='vermelho')).length,pm.eventos.filter(e=>e.lado==='f'&&(e.tipo==='amarelo'||e.tipo==='vermelho')).length)}
    </div><div class="eventos">${pm.eventos.slice().reverse().map(e=>`<div><b class="num">${e.min}'</b> ${e.tipo==='gol'?'⚽':e.tipo==='vermelho'?'🟥':e.tipo==='amarelo'?'🟨':e.tipo==='lesao'?'🚑':e.tipo==='penalti_perdido'||e.tipo==='falta_perdida'?'❌':e.tipo==='escanteio'?'🚩':e.tipo==='impedimento'?'🚫':e.tipo==='lance'?'👀':''} ${esc(e.txt)}</div>`).join('')||'<div class="muted">Bola rolando...</div>'}</div></div>
  </div>
  <div class="controles">${fim?`<button class="primario" onclick="ui.partida=null;ui.tela='${telaAoFim}';render()">Continuar</button>`:
    p.cobranca?'':forcado?`<button disabled title="Faça a substituição obrigatória primeiro">🚑 Substituição obrigatória</button>`:`<button ${p.vel===1&&!p.pausado?'disabled':''} onclick="setVelocidade(1)">Normal</button><button ${p.vel===2&&!p.pausado?'disabled':''} onclick="setVelocidade(2)">Rápido</button><button onclick="setVelocidade(0)">Pular para o fim</button><button onclick="${p.pausado?'retomarPartida()':'pausarPartida()'}">${p.pausado?(intervalo?'▶ Iniciar 2º tempo':'▶ Continuar'):'⏸ Pausar e substituir'}</button>`}</div>
  ${!fim&&p.cobranca?painelCobranca():''}
  ${!fim&&p.pausado&&!p.cobranca?painelSubstituicao(m):''}
  ${p.copa?'':lista(m.div)}`;
}
function telaTemporada(){
  const r=resumoTemporada(),m=meu();
  const vencendo=m.jogadores.map(J).filter(j=>j&&j.contrato<=1).map(j=>({j,custo:Motor.custoRenovacao(j,false).custo}));
  const renovacoes=vencendo.length?`<div class="painel" style="margin-top:20px"><h2>Contratos para renovar</h2><p class="aviso">Estes jogadores ficam sem contrato na virada e saem do clube se não forem renovados agora.</p><table><tr><th>Nome</th><th>Pos</th><th class="r">Força</th><th class="r">Salário</th><th></th></tr>${vencendo.map(({j,custo})=>`<tr><td>${esc(j.nome)}</td><td><span class="tag ${j.pos}">${j.pos}</span></td><td class="r"><span class="forca ${classeForca(j.forca)}">${j.forca}</span></td><td class="r">${fmt(j.salario)}</td><td><button ${m.caixa<custo?'disabled':''} onclick="renovar(${j.id})">Renovar (${fmt(custo)})</button></td></tr>`).join('')}</table>${vencendo.some(({custo})=>m.caixa<custo)?'<p class="muted">Botões desativados indicam que o caixa não cobre a renovação.</p>':''}</div>`:'';
  return `<div class="painel" style="max-width:700px;margin:0 auto"><h1 style="color:var(--amarelo)">Fim da temporada ${state.temporada}</h1>
  <p class="muted">${CONF_NOME[m.conf]}</p>
  <table style="margin:14px 0">
  ${['A','B','C','D'].map(d=>`<tr><td>Campeão da Série ${d}</td><td>🏆 ${linhaTime(r.campeoes[d])}</td></tr>`).join('')}
  <tr><td>Artilheiro</td><td>${esc(r.artilheiro.nome)} (${esc(state.times[r.artilheiro.time].nome)}) — ${r.artilheiro.gols} gols</td></tr>
  <tr><td>Seu time</td><td>${posicao(m.id)}º lugar na Série ${m.div}</td></tr></table>
  ${Object.values(r.campeoes).includes(m.id)?'<div class="ok">Título conquistado! Prêmio em dinheiro creditado na próxima temporada.</div>':''}
  ${r.transicoes.some(tr=>tr.caem.includes(m.id))?'<div class="aviso">Seu time foi rebaixado.</div>':''}
  ${r.transicoes.some(tr=>tr.sobem.includes(m.id))?'<div class="ok">Acesso garantido pra divisão de cima!</div>':''}
  <p class="muted">Na virada, os jogadores envelhecem: jovens evoluem, veteranos caem e quem passa dos 36 se aposenta.</p>
  ${renovacoes}
  <button class="primario" onclick="novaTemporada()">Continuar no ${esc(m.nome)} — iniciar temporada ${state.temporada+1}</button>
  <h3 style="margin-top:20px">Mercado de trabalho</h3>
  <p class="muted">Reputação do técnico: <b class="num">${state.tecnico.reputacao}/100</b>. Clubes mais fortes e de divisões superiores exigem mais reputação. Seu histórico e seus títulos acompanham você.</p>
  <div class="taticas">${ofertasClube().map(o=>{const t=state.times[o.clubeId];return `<button onclick="trocarClube(${t.id})">Assumir o ${esc(t.nome)} <span class="muted">(${CONF_NOME[t.conf]} · Série ${t.div}, força ${t.forca}, salário ${fmt(o.salario)}/temporada)</span></button>`;}).join('')||'<p class="aviso">Nenhum clube está procurando um técnico com sua reputação no momento. Você pode continuar no clube atual e tentar novamente na próxima temporada.</p>'}</div>
  ${state.tecnico.historico.length?`<h3 style="margin-top:20px">Histórico recente</h3>${state.tecnico.historico.slice(0,4).map(h=>`<p class="muted">Temporada ${h.temporada}: ${esc(h.clubeNome)}${h.posicao?` — ${h.posicao}º lugar (${h.variacao>=0?'+':''}${h.variacao} reputação)`:''}${h.troca?' — troca de clube':''}</p>`).join('')}`:''}
  </div>`;
}
function ofertasClube(){
  if(!state.ofertasEmprego.length)state.ofertasEmprego=ofertasEmprego();
  return state.ofertasEmprego;
}
function trocarClube(novoId){
  const antigo=meu().nome,novo=state.times[novoId].nome;
  if(!confirm('Deixar o '+antigo+' e assumir o '+novo+' para a próxima temporada?'))return;
  novaTemporada();
  Motor.assumirClube(state,novoId);
  gerarCopa();
  noticia('Você deixou o '+antigo+' e assumiu o comando do '+novo+'!');
  salvar();render();
}
render();
</script>
</body>
</html>
