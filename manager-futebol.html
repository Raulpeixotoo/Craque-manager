<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craque Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --grama:#0f3d2e; --grama2:#12483a; --board:#0c1a14; --painel:#142a21; --linha:#25443a;
  --branco:#f2f5ee; --muted:#9bb3a6; --amarelo:#f5c518; --vermelho:#e0533f; --azul:#4aa3df;
  --fd:"Barlow Condensed","Arial Narrow",sans-serif; --fb:"Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--board);color:var(--branco);font-family:var(--fb);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:1px solid var(--linha);background:var(--painel);color:var(--branco);padding:6px 12px;border-radius:4px;font-size:13px}
button:hover{border-color:var(--amarelo)}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--linha)}
button.primario{background:var(--amarelo);color:#1a1400;border-color:var(--amarelo);font-family:var(--fd);font-size:18px;font-weight:700;padding:8px 18px;letter-spacing:.3px}
button.primario:hover{background:#ffd54a}
select,input{font-family:inherit;background:var(--board);color:var(--branco);border:1px solid var(--linha);padding:5px 8px;border-radius:4px;font-size:13px}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:24px;margin-bottom:10px}
h3{font-size:18px;color:var(--amarelo)}
.num{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.neg{color:var(--vermelho)}
.pos{color:#7ee081}
#app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--painel);border-bottom:2px solid var(--amarelo)}
header .escudo{width:34px;height:34px;border-radius:50%;flex:none}
header .info{line-height:1.1}
header .info small{color:var(--muted)}
header .stats{margin-left:auto;display:flex;gap:22px;text-align:right}
header .stats div span{display:block;color:var(--muted);font-size:11px}
header .stats .num{font-size:22px}
nav{display:flex;gap:2px;padding:0 18px;background:var(--painel);border-bottom:1px solid var(--linha);overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;font-family:var(--fd);font-size:17px;font-weight:500;color:var(--muted)}
nav button.ativo{color:var(--branco);border-bottom-color:var(--amarelo)}
nav button:hover{color:var(--branco)}
main{padding:18px;flex:1;max-width:1200px;width:100%;margin:0 auto}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.painel{background:var(--painel);border:1px solid var(--linha);border-radius:6px;padding:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:400;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--linha)}
td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
tr.eu td{background:rgba(245,197,24,.12)}
tr.clic{cursor:pointer}tr.clic:hover td{background:rgba(255,255,255,.05)}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-family:var(--fd);font-weight:700;font-size:12px;padding:1px 6px;border-radius:3px;background:var(--linha);color:var(--branco);min-width:34px;text-align:center}
.tag.GOL{background:#7a4b00}.tag.ZAG{background:#1d4e89}.tag.LAT{background:#2a6fb0}.tag.VOL{background:#3d6b2f}.tag.MEI{background:#5b8a3a}.tag.ATA{background:#9c2f2f}
.forca{font-family:var(--fd);font-weight:700;font-size:16px}
.f1{color:var(--muted)}.f2{color:var(--branco)}.f3{color:#7ee081}.f4{color:var(--amarelo)}
.cor{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid rgba(255,255,255,.3)}
.escudo{border:2px solid rgba(255,255,255,.35)}
/* menu */
.menu{max-width:900px;margin:40px auto}
.menu h1{font-size:64px;color:var(--amarelo);letter-spacing:1px}
.menu p{color:var(--muted);max-width:60ch}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.tcard{background:var(--painel);border:1px solid var(--linha);border-radius:6px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tcard:hover{border-color:var(--amarelo)}
.tcard .escudo{width:30px;height:30px;border-radius:50%;flex:none}
.tcard small{display:block;color:var(--muted)}
/* campo */
.campo-wrap{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
@media(max-width:760px){.campo-wrap{grid-template-columns:1fr}}
.campo{position:relative;aspect-ratio:3/4;background:repeating-linear-gradient(0deg,var(--grama) 0 12.5%,var(--grama2) 12.5% 25%);border:2px solid rgba(255,255,255,.55);border-radius:4px;overflow:hidden}
.campo::before,.campo::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.45)}
.campo::before{top:-2px;width:60%;height:18%;border-top:0}
.campo::after{bottom:-2px;width:60%;height:18%;border-bottom:0}
.campo .meio{position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(255,255,255,.45)}
.campo .circ{position:absolute;top:50%;left:50%;width:24%;aspect-ratio:1;border:2px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%)}
.jog{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:72px}
.jog .cam{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:15px;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.jog .nome{font-size:11px;background:rgba(0,0,0,.55);border-radius:3px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jog.sel .cam{outline:3px solid var(--amarelo);outline-offset:2px}
.jog.fora .nome{color:var(--amarelo)}
.banco tr.sel td{background:rgba(245,197,24,.25)}
.taticas{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
/* partida */
.placar{background:linear-gradient(180deg,#153428,#0f2a20);border:1px solid var(--linha);border-radius:6px;padding:14px 18px}
.placar .linha1{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.placar .tempo{height:8px;background:var(--board);border-radius:4px;overflow:hidden;width:160px}
.placar .tempo i{display:block;height:100%;background:var(--amarelo)}
.placar .linha2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:10px 0}
.placar .time{font-family:var(--fd);font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.placar .time.d{justify-content:flex-end;text-align:right}
.placar .gols{font-family:var(--fd);font-size:56px;font-weight:700;line-height:1;background:var(--board);padding:2px 18px;border-radius:6px;min-width:150px;text-align:center}
.stat{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.stat .bar{height:6px;background:var(--board);border-radius:3px;overflow:hidden;display:flex}
.stat .bar i{display:block;height:100%}
.stat .bar i:first-child{background:var(--amarelo)}.stat .bar i:last-child{background:var(--azul);margin-left:auto}
.eventos{max-height:200px;overflow:auto;font-size:13px}
.eventos div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.jogos td{padding:4px 6px}
.jogos .plc{font-family:var(--fd);font-weight:700;font-size:16px;text-align:center;background:var(--board);border-radius:3px;padding:0 6px}
.jogos tr.eu td{background:rgba(245,197,24,.12)}
.controles{display:flex;gap:8px;align-items:center;margin:12px 0}
.aviso{background:rgba(224,83,63,.15);border:1px solid var(--vermelho);padding:8px 12px;border-radius:4px;margin:10px 0}
.ok{background:rgba(126,224,129,.12);border:1px solid #7ee081;padding:8px 12px;border-radius:4px;margin:10px 0}
.noticias div{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.noticias small{color:var(--muted);margin-right:8px;font-family:var(--fd)}
.res{font-family:var(--fd);font-weight:700;padding:1px 6px;border-radius:3px;font-size:13px;min-width:22px;display:inline-block;text-align:center}
.res.V{background:#2f7a35}.res.E{background:#666}.res.D{background:#8d2c2c}
</style>
</head>

function gerarClubesConfederacao(conf,cidades,forcaBase,tiers){
  const sufixos=SUFIXOS_POR_CONF[conf];
  const cores=['#c8102e','#1a1a1a','#005baa','#1e3a8a','#0a7d3c','#0f6b3a','#e05a00','#7b1fa2','#b71c1c','#2e7d32','#0288d1','#f5c518','#00695c','#0d47a1','#212121','#fdd835','#8d6e63','#bf360c','#004d40','#37474f','#1b5e20','#01579b','#ad1457','#6a1b9a'];
  const porCidade=Math.round((tiers.length*12)/cidades.length),times=[];
  cidades.forEach((cidade,i)=>{
    for(let k=0;k<porCidade;k++){
      const idx=i*porCidade+k,tierIdx=Math.min(tiers.length-1,Math.floor(idx/12)),div=tiers[tierIdx];
      const nome=cidade+' '+sufixos[(i+k*6)%sufixos.length];
      const cor1=cores[idx%cores.length],cor2=idx%2?'#ffffff':'#000000';
      const forca=clamp(forcaBase-tierIdx*7+rnd(-4,4),42,90);
      const torcida=Math.max(3000,Math.round(forcaBase*380-tierIdx*3500+rnd(-2000,2000)));
      times.push({nome,cidade,cor1,cor2,forca,torcida,div,conf});
    }
  });
  return times;
}

function valorJogador(f,idade){let v=Math.pow(f/10,3)*32000;if(idade<23)v*=1.25;else if(idade>31)v*=.6;return Math.round(v/10000)*10000;}

function gerarCalendario(ids){
  const n=ids.length,arr=ids.slice(),rodadas=[];
  for(let r=0;r<n-1;r++){const jogos=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];jogos.push(r%2?{casa:a,fora:b}:{casa:b,fora:a});}rodadas.push(jogos);arr.splice(1,0,arr.pop());}
  const volta=rodadas.map(r=>r.map(j=>({casa:j.fora,fora:j.casa})));
  return rodadas.concat(volta).map(r=>r.map(g=>({...g,gc:null,gf:null,eventos:[]})));
}
function gerarTemporada(){
  state.calendario={};
  CONFEDERACOES.forEach(conf=>{
    state.calendario[conf]={};
    ['A','B','C','D'].forEach(d=>state.calendario[conf][d]=gerarCalendario(state.times.filter(t=>t.conf===conf&&t.div===d).map(t=>t.id)));

function noticia(txt){state.noticias.unshift({r:state.rodada,t:state.temporada,txt});state.noticias=state.noticias.slice(0,40);}
function criarTorneioMataMata(ids,fase0,rodadaAlvo){
  const embaralhado=ids.slice();
  for(let i=embaralhado.length-1;i>0;i--){const j=rnd(0,i);[embaralhado[i],embaralhado[j]]=[embaralhado[j],embaralhado[i]];}
  const jogos=[];for(let i=0;i<embaralhado.length;i+=2)jogos.push({a:embaralhado[i],b:embaralhado[i+1]});
  return {jogos,fase:fase0,rodadaAlvo,campeao:null,historico:[]};
}
function simularJogoCopa(a,b){
  const p=criarPartida({casa:a,fora:b,gc:null,gf:null,eventos:[]});
  while(!p.fim)minuto(p);
  let vencedor,penaltis=null;
  if(p.gc===p.gf){
    vencedor=Math.random()<p.H.ata/(p.H.ata+p.A.ata)?a:b;
    const pv=rnd(3,5),pp=rnd(Math.max(0,pv-3),pv-1);
    penaltis=vencedor===a?(pv+'x'+pp):(pp+'x'+pv);
  }else vencedor=p.gc>p.gf?a:b;
  return {a,b,gc:p.gc,gf:p.gf,vencedor,penaltis};
}
function jogarFaseMataMata(torneio){
  if(!torneio||(torneio.campeao!==null&&torneio.campeao!==undefined)||!torneio.jogos.length)return null;
  const resultados=torneio.jogos.map(g=>simularJogoCopa(g.a,g.b));
  torneio.historico.push({fase:torneio.fase,rodada:state.rodada+1,resultados});
  const vencedores=resultados.map(r=>r.vencedor);
  if(vencedores.length===1){torneio.campeao=vencedores[0];torneio.jogos=[];}
  else{
    const prox=[];for(let i=0;i<vencedores.length;i+=2)prox.push({a:vencedores[i],b:vencedores[i+1]});
    torneio.jogos=prox;torneio.fase=FASES_COPA[prox.length]||'Fase final';torneio.rodadaAlvo=Math.min(state.rodada+4,RODADAS_TEMPORADA-1);
  }
  return resultados;
}

function jogarTorneio(torneio,premio,tituloNome){

  });

const meu=()=>state.times[state.meuTime];
const J=id=>state.jogadores[id];

/* ============ ESCALAÇÃO ============ */
function rating(j,pos){if(j.pos===pos)return j.forca;if(pos==='GOL'||j.pos==='GOL')return j.forca*.4;return j.forca*((COMPAT[pos]||{})[j.pos]||.75);}
function autoEscalar(t){
  const slots=FORMACOES[t.formacao];const usados=new Set();t.titulares=[];
  const disp=t.jogadores.map(J).filter(j=>!j.suspenso&&!j.lesao&&!j.selecao);
  slots.forEach(pos=>{let best=null,bv=-1;disp.forEach(j=>{if(usados.has(j.id))return;const v=rating(j,pos);if(v>bv){bv=v;best=j;}});
    if(!best){best=t.jogadores.map(J).find(j=>!usados.has(j.id));}usados.add(best.id);t.titulares.push(best.id);});
}
function coords(form){const linhas=form.split('-').map(Number),n=linhas.length,p=[{x:50,y:90}];
  linhas.forEach((k,i)=>{const y=74-i*(56/(n-1));for(let j=0;j<k;j++)p.push({x:100/(k+1)*(j+1),y});});return p;}
function forcaTime(t,mando){
  const slots=FORMACOES[t.formacao],est=ESTILOS[t.estilo];let ata=0,na=0,def=0,nd=0;
  t.titulares.forEach((id,i)=>{const j=J(id),pos=slots[i],r=rating(j,pos);
    if(pos==='ATA'||pos==='MEI'){ata+=r;na++;}else if(pos==='VOL'){ata+=r*.4;na+=.4;def+=r*.6;nd+=.6;}else{def+=r;nd++;}});
  const mf=.93+(t.moral/100)*.14;
  const tr=t.treino||{passe:0,falta:0,penalti:0,fisico:0};
  const bAta=1+tr.passe/500,bGoleiro=1+(t.staff?t.staff.goleiro:0)*.025,bDef=(1+tr.fisico/500)*bGoleiro;
  return {ata:(ata/na)*est.ata*mf*bAta*(mando?1.05:.97),def:(def/nd)*est.def*mf*bDef*(mando?1.05:.97)};
}

/* ============ SIMULAÇÃO ============ */
function criarPartida(g){
  const H=state.times[g.casa],A=state.times[g.fora];
  return {g,min:0,gc:0,gf:0,fc:0,ff:0,posse:50,eventos:[],H:forcaTime(H,true),A:forcaTime(A,false),fim:false};
}
function emCampo(t){return t.titulares.map(J).filter(j=>!j.suspenso&&!j.lesao);}
function escolherAutor(t){
  const slots=FORMACOES[t.formacao],pesos={ATA:6,MEI:3,VOL:1,LAT:1,ZAG:.5,GOL:.05};
  const cands=t.titulares.map((id,i)=>({j:J(id),p:pesos[slots[i]]*(J(id).forca/70)})).filter(c=>!c.j.suspenso&&!c.j.lesao);
  if(!cands.length)return J(t.titulares[0]);
  let tot=cands.reduce((s,c)=>s+c.p,0),r=Math.random()*tot;
  for(const c of cands){r-=c.p;if(r<=0)return c.j;}return cands[0].j;
}
function podeInteragir(){return ui.tela==='partida'&&ui.partida&&ui.partida.vel!==0&&!ui.partida.cobranca;}
function ativarCobranca(p,l,t,tipo){
  ui.partida.cobranca={p,l,timeId:t.id,tipo,batedor:null};

function forcarSubstituicao(jogadorId){

function minuto(p){
  if(p.fim)return;p.min++;
  const H=state.times[p.g.casa],A=state.times[p.g.fora];
  const rH=p.H.ata/p.A.def,rA=p.A.ata/p.H.def;
  p.posse=p.posse*.92+(rH/(rH+rA)*100)*.08;
  const lados=[[rH,H,'c'],[rA,A,'f']];
  for(const [r,t,l] of lados){
    if(Math.random()<.11*Math.pow(r,1.5)){if(l==='c')p.fc++;else p.ff++;}
    if(Math.random()<.0155*Math.pow(r,2.3)){const a=escolherAutor(t);a.gols++;if(l==='c')p.gc++;else p.gf++;
      let txtGol='Gol de '+a.nome+' ('+t.nome+')';
      if(Math.random()<.65){const cands=emCampo(t).filter(x=>x.id!==a.id);if(cands.length){const assist=pick(cands);assist.assistencias++;txtGol='Gol de '+a.nome+', assistência de '+assist.nome+' ('+t.nome+')';}}
      p.eventos.push({min:p.min,tipo:'gol',txt:txtGol,lado:l});}
    if(Math.random()<.018){const candCartao=emCampo(t);if(candCartao.length){const a=pick(candCartao);a.cartoes++;
      if(Math.random()<.08){if(l==='c')p.H.ata*=.9,p.H.def*=.9;else p.A.ata*=.9,p.A.def*=.9;a.suspenso=2;
        p.eventos.push({min:p.min,tipo:'vermelho',txt:'Cartão vermelho para '+a.nome+' ('+t.nome+') — joga com um a menos',lado:l});}
      else p.eventos.push({min:p.min,tipo:'amarelo',txt:'Amarelo para '+a.nome+' ('+t.nome+')',lado:l});}}
    const tr=t.treino||{passe:0,falta:0,penalti:0,fisico:0};
    if(Math.random()<.0009){
      if(t.id===state.meuTime&&podeInteragir()){ativarCobranca(p,l,t,'penalti');return;}
      const a=escolherAutor(t),conv=.76+tr.penalti/500;
      if(Math.random()<conv){a.gols++;if(l==='c')p.gc++;else p.gf++;p.eventos.push({min:p.min,tipo:'gol',txt:'Pênalti convertido por '+a.nome+' ('+t.nome+')',lado:l});}
      else p.eventos.push({min:p.min,tipo:'penalti_perdido',txt:'Pênalti perdido por '+a.nome+' ('+t.nome+')',lado:l});
    }
    if(Math.random()<.001*(1+tr.falta/100)){
      if(t.id===state.meuTime&&podeInteragir()){ativarCobranca(p,l,t,'falta');return;}
      const a=escolherAutor(t);a.gols++;if(l==='c')p.gc++;else p.gf++;
      p.eventos.push({min:p.min,tipo:'gol',txt:'Golaço de falta de '+a.nome+' ('+t.nome+')',lado:l});
    }
    if(Math.random()<.0035*(1-(t.staff?t.staff.fisico:0)*.15)){const candLesao=emCampo(t);if(candLesao.length){const a=pick(candLesao);const dur=rnd(2,12);a.lesao=dur;a.lesaoTipo=pick(['muscular','torção no tornozelo','pancada no joelho','desgaste físico']);
      a.lesoesTotal=(a.lesoesTotal||0)+1;if(a.lesoesTotal>=3&&!a.fragil){a.fragil=true;a.valor=Math.round(a.valor*.85/1e4)*1e4;}
      p.eventos.push({min:p.min,tipo:'lesao',txt:a.nome+' sentiu e deixou o gramado ('+t.nome+')',lado:l});
      if(t.id===state.meuTime&&podeInteragir())forcarSubstituicao(a.id);}}
  }
  if(p.min>=90)finalizar(p);
}
function finalizar(p){
  p.fim=true;p.g.gc=p.gc;p.g.gf=p.gf;p.g.eventos=p.eventos;
  const H=state.times[p.g.casa],A=state.times[p.g.fora];
  const dh=p.gc>p.gf?5:p.gc<p.gf?-5:0;
  H.moral=clamp(H.moral+dh,40,100);A.moral=clamp(A.moral-dh,40,100);
}
function rodadaAtual(){const c=state.calendario[meu().conf];return {A:c.A[state.rodada],B:c.B[state.rodada],C:c.C[state.rodada],D:c.D[state.rodada]};}
function resolverRodadasForaneas(){
  CONFEDERACOES.filter(c=>c!==meu().conf).forEach(conf=>{
    ['A','B','C','D'].forEach(div=>{
      state.calendario[conf][div][state.rodada].forEach(g=>{if(g.gc===null){const p=criarPartida(g);while(!p.fim)minuto(p);}});
    });
  });
}
function iniciarRodada(){
  state.times.forEach(t=>{t.jogadores.map(J).forEach(j=>{if((j.suspenso>0||j.lesao>0||j.selecao>0)&&t.titulares.includes(j.id)&&t.id!==state.meuTime)autoEscalar(t);});
    if(t.id!==state.meuTime&&Math.random()<.3){t.estilo=pick(Object.keys(ESTILOS));autoEscalar(t);}});
  resolverRodadasForaneas();
  const m=meu();
  if(m.titulares.some(id=>J(id).suspenso>0||J(id).lesao>0||J(id).selecao>0)){autoEscalar(m);noticia('Jogador suspenso, lesionado ou convocado foi retirado da escalação automaticamente.');}
  const r=rodadaAtual();
  ui.partida={jogos:{A:r.A.map(criarPartida),B:r.B.map(criarPartida),C:r.C.map(criarPartida),D:r.D.map(criarPartida)},timer:null,vel:1,pausado:false,subsUsadas:0,intervaloFeito:false,subForcada:null};
  ui.tela='partida';render();
  setVelocidade(1);
}
function todosJogos(p){return [...p.jogos.A,...p.jogos.B,...p.jogos.C,...p.jogos.D];}
function setVelocidade(v){
  const p=ui.partida;p.vel=v;p.pausado=false;p.cobranca=null;clearInterval(p.timer);
  const tick=()=>{todosJogos(p).forEach(minuto);
    if(p.jogos.A[0].fim){clearInterval(p.timer);if(p.copa)concluirPartidaCopa();else concluirRodada();}
    else if(p.cobranca){clearInterval(p.timer);}
    else if(p.jogos.A[0].min===45&&!p.intervaloFeito){p.intervaloFeito=true;p.pausado=true;clearInterval(p.timer);}
    render();};
  if(v===0){while(!p.jogos.A[0].fim)todosJogos(p).forEach(minuto);if(p.copa)concluirPartidaCopa();else concluirRodada();render();}
  else p.timer=setInterval(tick,v===1?260:80);
}
function pausarPartida(){const p=ui.partida;clearInterval(p.timer);p.pausado=true;render();}
function retomarPartida(){setVelocidade(ui.partida.vel||1);}
function pmAtual(){const p=ui.partida,m=meu();return todosJogos(p).find(x=>x.g.casa===m.id||x.g.fora===m.id);}
function recalcularForcaPartida(){
  const m=meu(),pm=pmAtual(),mandante=pm.g.casa===m.id;
  if(mandante)pm.H=forcaTime(m,true);else pm.A=forcaTime(m,false);
}
function mudarEstiloPartida(e){meu().estilo=e;recalcularForcaPartida();salvar();render();}
function clicarPartida(id){
  const p=ui.partida;if(!p||!p.pausado)return;
  const m=meu();
  if(ui.sel===null||ui.sel===id){ui.sel=ui.sel===id?null:id;render();return;}
  const a=ui.sel,b=id,ia=m.titulares.indexOf(a),ib=m.titulares.indexOf(b);
  if(ia>=0&&ib>=0){
    if(J(a).suspenso||J(b).suspenso){alert('Jogador expulso não pode trocar de posição — o time joga com um a menos.');ui.sel=null;render();return;}
    m.titulares[ia]=b;m.titulares[ib]=a;
  }else if(ia>=0||ib>=0){
    const entra=ia>=0?b:a,sai=ia>=0?a:b;
    if(J(sai).suspenso){alert('Jogador expulso não pode ser substituído — o time joga com um a menos.');ui.sel=null;render();return;}
    if(J(entra).suspenso||J(entra).lesao||J(entra).selecao){alert('Jogador indisponível.');ui.sel=null;render();return;}
    if((p.subsUsadas||0)>=5){alert('Limite de 5 substituições atingido.');ui.sel=null;render();return;}
    if(ia>=0)m.titulares[ia]=b;else m.titulares[ib]=a;
    p.subsUsadas=(p.subsUsadas||0)+1;
    noticia('Substituição: '+J(entra).nome+' entra no lugar de '+J(sai).nome+'.');
    if(p.subForcada===sai)p.subForcada=null;
  }else{ui.sel=null;render();return;}
  ui.sel=null;recalcularForcaPartida();salvar();render();
}
function escolherBatedor(id){ui.partida.cobranca.batedor=id;render();}
function cobrar(tipoKey){
  const c=ui.partida.cobranca,p=c.p,t=state.times[c.timeId],batedor=J(c.batedor);
  const tipos=c.tipo==='penalti'?TIPOS_PENALTI:TIPOS_FALTA,info=tipos[tipoKey];
  const tr=t.treino||{passe:0,falta:0,penalti:0,fisico:0};
  const adversario=state.times[c.l==='c'?p.g.fora:p.g.casa];
  const defGoleiro=(adversario.staff?adversario.staff.goleiro:0)*.03;
  const bonusTreino=(c.tipo==='penalti'?tr.penalti:tr.falta)/300;
  const bonusBatedor=(batedor.forca-70)/300;
  const chance=clamp(info.chance+bonusTreino+bonusBatedor-defGoleiro,.15,.95);
  const gol=Math.random()<chance;
  let autor=batedor,txt;
  if(gol){
    if(c.tipo==='falta'&&tipoKey==='cruzamento'){autor=escolherAutor(t);txt=info.golTxt.replace('X',autor.nome);}
    else txt=c.tipo==='falta'?info.golTxt.replace('X',batedor.nome):(batedor.nome+' cobrou o pênalti ('+info.nome+') e marcou! GOL!');
    autor.gols++;if(c.l==='c')p.gc++;else p.gf++;
    p.eventos.push({min:p.min,tipo:'gol',txt,lado:c.l});
  }else{
    txt=c.tipo==='falta'?info.forTxt.replace('X',batedor.nome):(batedor.nome+' cobrou o pênalti ('+info.nome+') e '+pick(['o goleiro defendeu!','mandou para fora!','acertou a trave!']));
    p.eventos.push({min:p.min,tipo:c.tipo==='penalti'?'penalti_perdido':'falta_perdida',txt,lado:c.l});
  }
  ui.partida.cobranca=null;
  if(p.min>=90)finalizar(p);
  render();salvar();
  if(!p.fim)retomarPartida();
}
function painelCobranca(){
  const c=ui.partida.cobranca,t=state.times[c.timeId];
  const elegiveis=emCampo(t).sort((a,b)=>b.forca-a.forca);
  if(c.batedor===null){
    return `<div class="painel" style="margin:12px 0;border-color:var(--amarelo)"><h3>${c.tipo==='penalti'?'🎯 Pênalti a favor!':'⚡ Falta perigosa!'}</h3>
    <p class="muted">Escolha quem vai cobrar:</p>
    <div class="taticas">${elegiveis.map(j=>`<button onclick="escolherBatedor(${j.id})">${esc(j.nome)} <span class="muted">(${j.pos} ${j.forca})</span></button>`).join('')}</div></div>`;

  <p class="muted" style="margin-top:6px">Passe o mouse nos botões pra ver a descrição de cada cobrança.</p></div>`;
}
function liberarSemSubstituir(){ui.partida.subForcada=null;render();}
function jogadorForcado(){const p=ui.partida,m=meu();return p.subForcada&&m.titulares.includes(p.subForcada)?J(p.subForcada):null;}
function painelSubstituicao(m){
  const banco=m.jogadores.map(J).filter(j=>!m.titulares.includes(j.id)&&!j.suspenso&&!j.lesao&&!j.selecao).sort((a,b)=>b.forca-a.forca);
  const linha=j=>`<tr class="clic ${ui.sel===j.id?'sel':''}" onclick="clicarPartida(${j.id})"><td>${esc(j.nome)}</td><td><span class="tag ${j.pos}">${j.pos}</span></td><td class="r"><span class="forca ${classeForca(j.forca)}">${j.forca}</span></td></tr>`;
  const forcado=jogadorForcado();
  return `<div class="painel" style="margin:12px 0;${forcado?'border-color:var(--vermelho)':''}">
  ${forcado?`<div class="aviso">🚑 Substituição obrigatória: <b>${esc(forcado.nome)}</b> está lesionado e precisa sair.${banco.length?'':' Não há ninguém disponível no banco — o time vai jogar com um a menos.'}</div>`:''}
  <h3>Substituições — ${5-(ui.partida.subsUsadas||0)} restantes</h3>
  <div class="grid g2"><div><p class="muted" style="margin:0 0 4px">Em campo</p><table>${m.titulares.map(id=>linha(J(id))).join('')}</table></div>
  <div><p class="muted" style="margin:0 0 4px">Banco</p><table>${banco.map(linha).join('')||'<tr><td class="muted">Sem opções no banco.</td></tr>'}</table></div></div>
  <p class="muted" style="margin-top:6px">Clique num titular e depois num jogador do banco para substituir, ou em dois titulares para trocar posições.</p>
  ${forcado&&!banco.length?`<button style="margin-top:8px" onclick="liberarSemSubstituir()">Continuar com o time reduzido</button>`:''}
  </div>`;
}
function jogoDoTime(t){return state.calendario[t.conf][t.div][state.rodada].find(g=>g.casa===t.id||g.fora===t.id);}
function concluirRodada(){
  // suspensões, lesões e convocações: decrementa após rodada
  Object.values(state.jogadores).forEach(j=>{if(j.suspenso>0)j.suspenso--;if(j.lesao>0)j.lesao=Math.max(0,j.lesao-1);
    if(j.selecao>0){j.selecao--;if(j.selecao===0){j.forca=clamp(j.forca+rnd(1,3),35,99);j.moral=100;noticia(j.nome+' voltou da Seleção valorizado!');}}});
  // finanças (todos os 240 times, cada um busca o próprio jogo na própria divisão)
  state.times.forEach(t=>{
    const jogo=jogoDoTime(t);
    const casa=jogo.casa===t.id;
    const rivalT=rivalDe(t.id),classicoT=rivalT!==null&&(jogo.casa===rivalT||jogo.fora===rivalT);
    const publico=Math.min(t.capacidade,Math.round(t.torcida*(.35+t.moral/200)*(classicoT&&casa?1.3:1)));
    const bilheteria=casa?publico*45:0;
    const tv=TV[t.div];const patrocinio=t.patrocinio||0;
    const sal=t.jogadores.reduce((s,id)=>s+J(id).salario,0);
    const custoStaff=((t.staff?.fisico||0)+(t.staff?.goleiro||0)+(t.staff?.olheiro||0))*15000;
    t.caixa+=bilheteria+tv+patrocinio-sal-custoStaff;
    if(t.id===state.meuTime)state.financas.push({t:state.temporada,r:state.rodada+1,bilheteria,tv,patrocinio,sal:sal+custoStaff,caixa:t.caixa});
  });
  const m=meu(),jm=jogoDoTime(m);
  const adv=state.times[jm.casa===m.id?jm.fora:jm.casa];
  const ehClassico=state.rivalId!=null&&(jm.casa===state.rivalId||jm.fora===state.rivalId);
  noticia((ehClassico?'🔥 CLÁSSICO! ':'')+state.times[jm.casa].nome+' '+jm.gc+' x '+jm.gf+' '+state.times[jm.fora].nome+(jm.eventos.filter(e=>e.tipo==='vermelho').length?' (com expulsão)':''));
  if(ehClassico){
    const meuGols=jm.casa===m.id?jm.gc:jm.gf,advGols=jm.casa===m.id?jm.gf:jm.gc;
    if(meuGols>advGols){state.classico.v++;m.moral=clamp(m.moral+10,0,100);}
    else if(meuGols<advGols){state.classico.d++;m.moral=clamp(m.moral-10,0,100);}
    else state.classico.e++;
  }
  if(m.caixa<0)noticia('Atenção: o caixa está negativo. Venda jogadores ou reduza a folha.');
  // mercado da IA: times ricos compram
  if(Math.random()<.35)negocioIA();
  if(Math.random()<.12)eventoVestiario();
  if(Math.random()<.08)convocarSelecao();
  if(Math.random()<.15)ofertaRecebida();
  // competições continentais alheias avançam sozinhas em segundo plano
  CONFEDERACOES.filter(c=>c!==m.conf).forEach(conf=>{
    const tor=state.continentais[conf];
    if(tor&&tor.campeao==null&&tor.jogos.length&&state.rodada>=tor.rodadaAlvo)jogarFaseMataMata(tor);
  });
  if(CONFEDERACOES.every(c=>state.continentais[c]&&state.continentais[c].campeao!=null)&&!state.mundial){
    gerarMundial();jogarMundial();
  }
  state.rodada++;state.dia++;
  if(state.rodada>=RODADAS_TEMPORADA)state.fimTemporada=true;
  m.treino={passe:Math.round(m.treino.passe*.4),falta:Math.round(m.treino.falta*.4),penalti:Math.round(m.treino.penalti*.4),fisico:Math.round(m.treino.fisico*.4)};
  state.diasParaJogo=DIAS_ENTRE_RODADAS;
  if(state.janela.aberta){state.janela.dias--;if(state.janela.dias<=0)state.janela.aberta=false;}
  if(!state.janela.meioAberta&&state.rodada===Math.floor(RODADAS_TEMPORADA/2)){
    state.janela={aberta:true,dias:10,meioAberta:true};noticia('Janela de transferências do meio da temporada aberta! 10 dias.');
  }
  salvar();
}
function eventoVestiario(){
  if(state.pedidoPendente)return;
  const m=meu(),cands=m.titulares.map(J).filter(j=>j.moral<70);
  if(!cands.length)return;
  const j=pick(cands),aumento=Math.round(j.salario*.25/1000)*1000;
  state.pedidoPendente={jogadorId:j.id,aumento};
}
function resolverPedido(aceitar){

  else{j.moral=clamp(j.moral-15,0,100);noticia(j.nome+' ficou insatisfeito após a recusa do pedido de aumento.');}

}
function painelPedido(){

  <tr><td>Idade</td><td class="r num">${j.idade}</td></tr>

  <tr><td>Novo salário se aceitar</td><td class="r">${fmt(j.salario+ped.aumento)}/rodada</td></tr></table>
  <button class="primario" onclick="resolverPedido(true)">Aceitar</button> <button onclick="resolverPedido(false)">Recusar</button></div>`;
}
function convocarSelecao(){
  const m=meu(),cands=m.jogadores.map(J).filter(j=>j.forca>=75&&!j.suspenso&&!j.lesao&&!j.selecao);
  if(!cands.length)return;
  const j=pick(cands);j.selecao=rnd(1,2);
  if(m.titulares.includes(j.id))autoEscalar(m);
  noticia(j.nome+' foi convocado para a Seleção Nacional! Fica de fora por '+j.selecao+' rodada(s).');
}
function negocioIA(){
  if(!state.janela.aberta)return;
  const comp=pick(state.times.filter(t=>t.id!==state.meuTime&&t.caixa>15e6));if(!comp)return;
  const vend=pick(state.times.filter(t=>t.id!==comp.id&&t.id!==state.meuTime&&t.jogadores.length>18));
  const j=vend.jogadores.map(J).filter(x=>!vend.titulares.includes(x.id)).sort((a,b)=>b.forca-a.forca)[0];
  if(!j||comp.jogadores.length>=25||comp.caixa<j.valor)return;
  transferir(j,vend,comp,j.valor);noticia(comp.nome+' contrata '+j.nome+' junto ao '+vend.nome+' por '+fmt(j.valor)+'.');
}
function transferir(j,de,para,preco){
  de.jogadores=de.jogadores.filter(id=>id!==j.id);de.titulares=de.titulares.filter(id=>id!==j.id);
  para.jogadores.push(j.id);j.time=para.id;de.caixa+=preco;para.caixa-=preco;
  if(de.titulares.length<11)autoEscalar(de);
  if(para.id!==state.meuTime)autoEscalar(para);
}

/* ============ TABELA ============ */
function tabela(conf,div){
  const st={};state.times.filter(t=>t.conf===conf&&t.div===div).forEach(t=>st[t.id]={id:t.id,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0,ult:[]});
  state.calendario[conf][div].forEach(r=>r.forEach(g=>{if(g.gc===null)return;const c=st[g.casa],f=st[g.fora];
    c.j++;f.j++;c.gp+=g.gc;c.gc+=g.gf;f.gp+=g.gf;f.gc+=g.gc;
    if(g.gc>g.gf){c.v++;f.d++;c.pts+=3;c.ult.push('V');f.ult.push('D');}
    else if(g.gc<g.gf){f.v++;c.d++;f.pts+=3;c.ult.push('D');f.ult.push('V');}
    else{c.e++;f.e++;c.pts++;f.pts++;c.ult.push('E');f.ult.push('E');}}));
  return Object.values(st).sort((a,b)=>b.pts-a.pts||b.v-a.v||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp||a.id-b.id);
}
function posicao(id){const t=state.times[id];return tabela(t.conf,t.div).findIndex(x=>x.id===id)+1;}

/* ============ TEMPORADA ============ */
function resumoTemporada(conf){
  conf=conf||meu().conf;
  const tabs={A:tabela(conf,'A'),B:tabela(conf,'B'),C:tabela(conf,'C'),D:tabela(conf,'D')};
  const transicoes=[['A','B'],['B','C'],['C','D']].map(([sup,inf])=>({sup,inf,caem:[tabs[sup][10].id,tabs[sup][11].id],sobem:[tabs[inf][0].id,tabs[inf][1].id]}));
  return {conf,campeoes:{A:tabs.A[0].id,B:tabs.B[0].id,C:tabs.C[0].id,D:tabs.D[0].id},transicoes,
    artilheiro:Object.values(state.jogadores).filter(j=>state.times[j.time].conf===conf).sort((a,b)=>b.gols-a.gols)[0]};
}
function premiosMundiais(){
  const todos=Object.values(state.jogadores).filter(j=>!j.emBase);
  const bolaDeOuro=todos.slice().sort((a,b)=>(b.forca+b.gols*.3+b.assistencias*.2)-(a.forca+a.gols*.3+a.assistencias*.2))[0];
  const artilheiro=todos.slice().sort((a,b)=>b.gols-a.gols)[0];
  const garcom=todos.slice().sort((a,b)=>b.assistencias-a.assistencias)[0];
  const revelacao=todos.filter(j=>j.idade<=21).sort((a,b)=>b.forca-a.forca)[0];
  const premios=[
    {nome:'Bola de Ouro',jogador:bolaDeOuro,bonus:3},
    {nome:'Artilheiro Mundial',jogador:artilheiro,bonus:1},
    {nome:'Rei das Assistências',jogador:garcom,bonus:1},
    {nome:'Craque Revelação',jogador:revelacao,bonus:2},
  ];
  const m=meu();
  state.premiosTemporada=[];
  premios.forEach(p=>{
    if(!p.jogador)return;
    if(p.nome==='Artilheiro Mundial'&&p.jogador.gols<=0)return;
    if(p.nome==='Rei das Assistências'&&p.jogador.assistencias<=0)return;
    p.jogador.forca=clamp(p.jogador.forca+p.bonus,35,99);
    state.premiosTemporada.push({nome:p.nome,jogadorNome:p.jogador.nome,timeNome:state.times[p.jogador.time].nome});
    const meuJogador=m.jogadores.includes(p.jogador.id)||m.prospectos.includes(p.jogador.id);
    if(meuJogador){state.titulos.push(p.nome+' — '+p.jogador.nome+' ('+state.temporada+')');noticia('🏅 '+p.jogador.nome+' do seu clube ganhou o prêmio de '+p.nome+'! Força +'+p.bonus+'.');}
    else noticia('🏅 Prêmio '+p.nome+': '+p.jogador.nome+' ('+state.times[p.jogador.time].nome+').');
  });
}
function novaTemporada(){
  const m=meu();
  const resumos={};CONFEDERACOES.forEach(conf=>resumos[conf]=resumoTemporada(conf));
  const meuResumo=resumos[m.conf];
  ['A','B','C','D'].forEach(d=>{if(meuResumo.campeoes[d]===m.id){state.titulos.push(CONF_NOME[m.conf]+' Série '+d+' '+state.temporada);m.caixa+=TITULO_PREMIO[d];}});
  const posFinal=posicao(m.id);
  const foiCampeao=Object.values(meuResumo.campeoes).includes(m.id);
  if(foiCampeao){m.torcida=Math.round(m.torcida*1.05);noticia('O título fez a torcida crescer! Nova média: '+m.torcida.toLocaleString('pt-BR')+'.');}
  else if(posFinal<=6)m.torcida=Math.round(m.torcida*1.02);
  CONFEDERACOES.forEach(conf=>{resumos[conf].transicoes.forEach(tr=>{tr.caem.forEach(id=>state.times[id].div=tr.inf);tr.sobem.forEach(id=>state.times[id].div=tr.sup);});});
  premiosMundiais();
  // evolução dos jogadores
  state.times.forEach(t=>{
    t.jogadores.slice().forEach(id=>{const j=J(id);j.idade++;j.gols=0;j.assistencias=0;j.cartoes=0;j.suspenso=0;j.lesao=0;j.lesaoTipo='';j.selecao=0;j.contrato--;
      if(j.idade<24)j.forca+=rnd(1,4);else if(j.idade<30)j.forca+=rnd(-1,2);else j.forca-=rnd(1,4);
      j.forca=clamp(j.forca,35,99);
      if(j.idade>=37){t.jogadores=t.jogadores.filter(x=>x!==id);delete state.jogadores[id];
        const novo=gerarJogador(j.pos,t.forca-8);novo.idade=rnd(17,19);novo.time=t.id;state.jogadores[novo.id]=novo;t.jogadores.push(novo.id);
        if(t.id===state.meuTime)noticia(j.nome+' se aposentou. O garoto '+novo.nome+' subiu da base.');}
      else if(j.contrato<=0){
        if(t.id===state.meuTime){
          t.jogadores=t.jogadores.filter(x=>x!==id);t.titulares=t.titulares.filter(x=>x!==id);
          const destino=pick(state.times.filter(x=>x.id!==t.id));destino.jogadores.push(id);j.time=destino.id;j.contrato=rnd(2,4);
          noticia(j.nome+' teve o contrato encerrado e assinou como agente livre com o '+destino.nome+'.');
        }else j.contrato=rnd(2,4);
      }
      j.valor=valorJogador(j.forca,j.idade)*(j.fragil?.85:1);j.valor=Math.round(j.valor/1e4)*1e4;j.salario=Math.round(j.valor*.004/1000)*1000;});
    t.moral=70;t.caixa+=CAIXA_BONUS_TEMPORADA[t.div];t.treino={passe:0,falta:0,penalti:0,fisico:0};autoEscalar(t);
  });
  m.prospectos.slice().forEach(id=>{const j=J(id);j.idade++;
    if(j.idade>=18){m.prospectos=m.prospectos.filter(x=>x!==id);j.emBase=false;j.salario=Math.round(j.valor*.004/1000)*1000;m.jogadores.push(id);
      noticia(j.nome+' (base) subiu para o elenco principal aos '+j.idade+' anos!');}});
  if(m.prospectos.length<5&&Math.random()<clamp(.12+m.baseNivel*.15,0,.9)){
    const pos=pick(POSICOES),novo=gerarJogador(pos,m.forca+rnd(-6,2));
    novo.idade=rnd(14,16);novo.emBase=true;novo.salario=0;
    novo.potencial=clamp(novo.forca+rnd(15,35)+m.baseNivel*5+m.staff.olheiro*3,novo.forca,98);
    novo.valor=Math.round(novo.valor*.3/1e4)*1e4;novo.time=m.id;

  }
  state.temporada++;state.dia=0;gerarTemporada();gerarCopa();gerarTorneiosContinentais();state.diasParaJogo=DIAS_ENTRE_RODADAS;
  state.janela={aberta:true,dias:10,meioAberta:false};
  noticia('Temporada '+state.temporada+' começou. Janela de transferências aberta (10 dias). Cota de participação depositada.');
  salvar();ui.tela='inicio';render();
}

/* ============ SAVE ============ */
const KEY='craque_manager_save';
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function carregar(){try{const s=localStorage.getItem(KEY);if(!s)return null;const st=JSON.parse(s);
    if(!st.versaoMundo||st.versaoMundo<2)return null;
    st.times.forEach(t=>{if(!t.treino)t.treino={passe:0,falta:0,penalti:0,fisico:0};
      if(!t.staff)t.staff={fisico:0,goleiro:0,olheiro:0};
      if(t.capacidade===undefined)t.capacidade=Math.round(t.torcida*1.15);
      if(t.patrocinio===undefined)t.patrocinio=0;});
    if(st.diasParaJogo===undefined)st.diasParaJogo=0;
    if(st.dia===undefined)st.dia=diaDaRodada(st.rodada-1)||0;
    if(!st.copa)st.copa={jogos:[],fase:'-',rodadaAlvo:st.rodada+4,campeao:null,historico:[]};
    if(st.rivalId===undefined){st.rivalId=rivalDe(st.meuTime);st.classico={v:0,e:0,d:0};}
    if(st.pedidoPendente===undefined)st.pedidoPendente=null;
    if(!st.janela)st.janela={aberta:true,dias:10,meioAberta:true};
    if(!st.continentais){st.continentais={};CONFEDERACOES.forEach(c=>{st.continentais[c]={jogos:[],fase:'-',rodadaAlvo:st.rodada+3,campeao:null,historico:[]};});}
    if(st.mundial===undefined)st.mundial=null;
    if(!st.premiosTemporada)st.premiosTemporada=[];
    Object.values(st.jogadores).forEach(j=>{if(j.assistencias===undefined)j.assistencias=0;});
    st.times.forEach(t=>{if(t.baseNivel===undefined)t.baseNivel=0;if(!t.prospectos)t.prospectos=[];});
    Object.values(st.jogadores).forEach(j=>{if(j.emBase===undefined)j.emBase=false;});
    Object.values(st.jogadores).forEach(j=>{if(j.lesao===undefined){j.lesao=0;j.lesaoTipo='';}
      if(j.contrato===undefined)j.contrato=rnd(1,4);
      if(j.selecao===undefined)j.selecao=0;
      if(j.lesoesTotal===undefined){j.lesoesTotal=0;j.fragil=false;}
      if(j.potencial===undefined)j.potencial=j.idade<=23?clamp(j.forca+rnd(5,25),40,96):j.forca;});
    return st;}catch(e){return null;}}
function temSave(){try{return !!localStorage.getItem(KEY);}catch(e){return false;}}
function apagarSave(){
  if(!confirm('Tem certeza que quer apagar o jogo salvo? Essa ação não pode ser desfeita.'))return;
  try{localStorage.removeItem(KEY);}catch(e){}

}

}

function proporOferta(id){
  if(!state.janela.aberta){alert('A janela de transferências está fechada.');return;}
  const j=J(id),de=state.times[j.time],m=meu();
  if(de.id===m.id){alert('Esse jogador já é seu.');return;}
  if(m.jogadores.length>=25){alert('Elenco no limite de 25 jogadores.');return;}
  if(de.jogadores.length<=11){alert(de.nome+' não pode vender: ficaria sem jogadores suficientes para escalar um time.');return;}
  const sugestao=Math.round(j.valor*1.1/1e4)*1e4;
  const entrada=prompt('Proposta por '+j.nome+' ('+de.nome+'). Valor de mercado: '+fmt(j.valor)+'. Quanto quer oferecer?',sugestao);
  if(entrada===null)return;
  const oferta=Math.round(Number(String(entrada).replace(/[^\d]/g,''))/1e4)*1e4;
  if(!oferta||oferta<=0){alert('Valor inválido.');return;}
  if(m.caixa<oferta){alert('Caixa insuficiente para essa proposta.');return;}
  let minimo=j.valor;
  if(de.titulares.includes(j.id))minimo*=1.4;
  if(de.jogadores.length<=17)minimo*=1.25;
  if(de.caixa<0)minimo*=.85;
  if(oferta>=minimo){
    transferir(j,de,m,oferta);j.moral=80;noticia('Proposta aceita! '+j.nome+' contratado do '+de.nome+' por '+fmt(oferta)+'.');salvar();render();
  }else alert(de.nome+' recusou a proposta. Eles pedem pelo menos '+fmt(Math.round(minimo/1e4)*1e4)+'.');
}
function ofertaRecebida(){

  if(!cands.length)return;
  const j=pick(cands),comp=pick(state.times.filter(t=>t.id!==m.id&&t.jogadores.length<25&&t.caixa>j.valor*.8));

    transferir(j,m,comp,oferta);noticia(j.nome+' vendido ao '+comp.nome+' por '+fmt(oferta)+' (oferta recebida).');

}

  <tr><td>Salário atual</td><td class="r">${fmt(j.salario)}/rodada</td></tr>
  <tr><td>Valor de mercado</td><td class="r">${fmt(j.valor)}</td></tr>
  <tr><td>Você recebe</td><td class="r pos" style="font-size:16px">${fmt(v.preco)}</td></tr></table>
  <button class="primario" onclick="confirmarVenda()">Confirmar venda</button> <button onclick="cancelarVenda()">Cancelar</button></div>`;
}
function reformarEstadio(){
  const m=meu(),inc=Math.round(m.capacidade*.12/500)*500,custo=inc*900;
  if(m.caixa<custo){alert('Caixa insuficiente para a reforma.');return;}
  if(!confirm('Reformar o estádio: +'+inc.toLocaleString('pt-BR')+' lugares por '+fmt(custo)+'?'))return;
  m.caixa-=custo;m.capacidade+=inc;noticia('Estádio reformado: capacidade agora é '+m.capacidade.toLocaleString('pt-BR')+' lugares.');
  salvar();render();
}
function buscarPatrocinio(){
  const m=meu(),oferta=Math.round((m.torcida*.6+rnd(5000,20000))/1000)*1000;
  if(!confirm('Novo patrocinador oferece '+fmt(oferta)+' por rodada (substitui o atual, '+fmt(m.patrocinio)+'). Aceitar?'))return;
  m.patrocinio=oferta;noticia('Novo patrocínio fechado: '+fmt(oferta)+' por rodada.');salvar();render();
}
function investirBase(){
  const m=meu();
  if(m.baseNivel>=3){alert('Nível máximo já investido.');return;}
  const custo=(m.baseNivel+1)*1.2e6;
  if(m.caixa<custo){alert('Caixa insuficiente.');return;}
  if(!confirm('Investir na categoria de base, nível '+(m.baseNivel+1)+', por '+fmt(custo)+'?'))return;
  m.caixa-=custo;m.baseNivel++;noticia('Categoria de base reforçada: agora nível '+m.baseNivel+'.');
  salvar();render();
}
function contratarStaff(area){
  const m=meu(),nivel=m.staff[area];
  if(nivel>=3){alert('Nível máximo já contratado.');return;}
  const custo=(nivel+1)*1.5e6;
  if(m.caixa<custo){alert('Caixa insuficiente.');return;}
  if(!confirm('Contratar '+STAFF_NOMES[area]+' nível '+(nivel+1)+' por '+fmt(custo)+'?'))return;
  m.caixa-=custo;m.staff[area]++;noticia('Comissão técnica reforçada: '+STAFF_NOMES[area]+' agora nível '+m.staff[area]+'.');
  salvar();render();
}
function telaFinancas(){
  const m=meu(),f=state.financas.filter(x=>x.t===state.temporada).slice().reverse();
  const folha=m.jogadores.reduce((s,id)=>s+J(id).salario,0);
  return `<div class="grid g2"><div class="painel"><h2>Resumo</h2>
  <table><tr><td>Caixa atual</td><td class="r num ${m.caixa<0?'neg':'pos'}" style="font-size:18px">${fmt(m.caixa)}</td></tr>
  <tr><td>Folha salarial por rodada</td><td class="r">${fmt(folha)}</td></tr>
  <tr><td>Cota de TV por rodada</td><td class="r">${fmt(TV[m.div])}</td></tr>
  <tr><td>Patrocínio por rodada</td><td class="r">${fmt(m.patrocinio)}</td></tr>
  <tr><td>Torcida média</td><td class="r num">${m.torcida.toLocaleString('pt-BR')}</td></tr>
  <tr><td>Capacidade do estádio</td><td class="r num">${m.capacidade.toLocaleString('pt-BR')}</td></tr>
  <tr><td>Valor do elenco</td><td class="r">${fmt(m.jogadores.reduce((s,id)=>s+J(id).valor,0))}</td></tr></table>
  <p class="muted">Bilheteria só entra em jogos em casa, cresce com a moral e é limitada pela capacidade do estádio. Se o caixa ficar negativo, venda jogadores.</p></div>
  <div class="painel"><h2>Movimento por rodada</h2><table><tr><th>Rod.</th><th class="r">Bilheteria</th><th class="r">TV</th><th class="r">Patroc.</th><th class="r">Salários</th><th class="r">Caixa</th></tr>
  ${f.map(x=>`<tr><td class="num">${x.r}</td><td class="r pos">${fmt(x.bilheteria)}</td><td class="r pos">${fmt(x.tv)}</td><td class="r pos">${fmt(x.patrocinio||0)}</td><td class="r neg">-${fmt(x.sal)}</td><td class="r num">${fmt(x.caixa)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhuma rodada jogada ainda.</td></tr>'}</table></div>
  <div class="painel"><h2>Estádio &amp; patrocínio</h2>
  <p class="muted">Capacidade atual: <b class="num">${m.capacidade.toLocaleString('pt-BR')}</b> lugares.</p>
  <button onclick="reformarEstadio()">Reformar estádio (+${Math.round(m.capacidade*.12/500)*500} lugares)</button>
  <p class="muted" style="margin-top:10px">Patrocínio atual: <b class="num">${fmt(m.patrocinio)}</b>/rodada.</p>
  <button onclick="buscarPatrocinio()">Buscar novo patrocinador</button></div>
  <div class="painel"><h2>Comissão técnica</h2>
  ${Object.keys(STAFF_NOMES).map(k=>`<div style="margin-bottom:10px"><b>${STAFF_NOMES[k]}</b> — nível ${m.staff[k]}/3<br><span class="muted">${STAFF_DESC[k]}</span><br>
    ${m.staff[k]<3?`<button style="margin-top:4px" onclick="contratarStaff('${k}')">Contratar nível ${m.staff[k]+1} (${fmt((m.staff[k]+1)*1.5e6)})</button>`:'<span class="pos">Nível máximo</span>'}</div>`).join('')}
  </div>
  <div class="painel"><h2>Categoria de base</h2>
  <p class="muted">Nível ${m.baseNivel}/3 — quanto maior, mais chance de revelar garotos e maior o potencial deles. Eles sobem pro elenco principal automaticamente aos 18 anos.</p>
  ${m.baseNivel<3?`<button onclick="investirBase()">Investir nível ${m.baseNivel+1} (${fmt((m.baseNivel+1)*1.2e6)})</button>`:'<span class="pos">Nível máximo</span>'}
  </div></div>`;
}
function telaPartida(){
  const p=ui.partida,m=meu();
  const pm=todosJogos(p).find(x=>x.g.casa===m.id||x.g.fora===m.id);
  const H=state.times[pm.g.casa],A=state.times[pm.g.fora],fim=p.jogos.A[0].fim;
  const stat=(n,a,b)=>{const t=a+b||1;return `<div class="stat"><span class="num r" style="text-align:right">${Math.round(a)}</span><div class="bar"><i style="width:${a/t*100}%"></i><i style="width:${b/t*100}%"></i></div><span class="num">${Math.round(b)}</span><span></span><span class="muted" style="text-align:center">${n}</span></div>`;};
  const lista=d=>`<div class="painel"><h3>Série ${d} — rodada ${state.rodada+1}</h3><table class="jogos">${p.jogos[d].map(x=>`<tr class="${x===pm?'eu':''}"><td class="r">${linhaTime(x.g.casa)}</td><td class="plc">${x.gc} x ${x.gf}</td><td>${linhaTime(x.g.fora)}</td><td class="muted" style="font-size:11px">${x.eventos.filter(e=>e.tipo==='gol').map(e=>e.min+"'").join(' ')}</td></tr>`).join('')}</table></div>`;
  const ehClassico=state.rivalId!=null&&(pm.g.casa===state.rivalId||pm.g.fora===state.rivalId);
  const intervalo=!fim&&p.jogos.A[0].min===45&&p.intervaloFeito;
  const forcado=jogadorForcado();
  const telaAoFim=p.copa?'calendario':(state.fimTemporada?'temporada':'inicio');
  return `<div class="placar">
    ${p.copa?`<div style="text-align:center;color:var(--amarelo);font-family:var(--fd);font-weight:700;font-size:15px;margin-bottom:6px">🏆 ${esc(p.copa.tituloNome)} — ${esc(p.copa.torneio.fase)}</div>`:''}
    ${ehClassico?'<div style="text-align:center;color:var(--amarelo);font-family:var(--fd);font-weight:700;font-size:15px;margin-bottom:6px">🔥 CLÁSSICO</div>':''}
    ${intervalo?'<div class="ok" style="text-align:center;font-family:var(--fd);font-weight:700;font-size:16px">⏱ INTERVALO — aproveite pra mexer no time</div>':''}
    <div class="linha1"><span>${pm.min<=45?'1º tempo':'2º tempo'}</span><div class="tempo"><i style="width:${pm.min/90*100}%"></i></div><span class="num" style="font-size:18px;color:var(--amarelo)">${pm.min}'</span></div>
    <div class="linha2"><div class="time">${linhaTime(H.id)}</div><div class="gols">${pm.gc} x ${pm.gf}</div><div class="time d">${linhaTime(A.id)}</div></div>
    ${fim?'':`<div class="taticas" style="margin:0 0 10px"><label>Instrução tática <select onchange="mudarEstiloPartida(this.value)">${Object.entries(ESTILOS).map(([k,v])=>`<option value="${k}" ${k===m.estilo?'selected':''}>${v.nome}</option>`).join('')}</select></label></div>`}
    <div class="grid g2" style="gap:18px"><div>
      ${stat('posse de bola',pm.posse,100-pm.posse)}${stat('finalizações',pm.fc,pm.ff)}
      ${stat('cartões',pm.eventos.filter(e=>e.lado==='c'&&e.tipo!=='gol').length,pm.eventos.filter(e=>e.lado==='f'&&e.tipo!=='gol').length)}
    </div><div class="eventos">${pm.eventos.slice().reverse().map(e=>`<div><b class="num">${e.min}'</b> ${e.tipo==='gol'?'⚽':e.tipo==='vermelho'?'🟥':e.tipo==='amarelo'?'🟨':e.tipo==='lesao'?'🚑':e.tipo==='penalti_perdido'||e.tipo==='falta_perdida'?'❌':''} ${esc(e.txt)}</div>`).join('')||'<div class="muted">Bola rolando...</div>'}</div></div>
  </div>
  <div class="controles">${fim?`<button class="primario" onclick="ui.partida=null;ui.tela='${telaAoFim}';render()">Continuar</button>`:
    p.cobranca?'':forcado?`<button disabled title="Faça a substituição obrigatória primeiro">🚑 Substituição obrigatória</button>`:`<button ${p.vel===1&&!p.pausado?'disabled':''} onclick="setVelocidade(1)">Normal</button><button ${p.vel===2&&!p.pausado?'disabled':''} onclick="setVelocidade(2)">Rápido</button><button onclick="setVelocidade(0)">Pular para o fim</button><button onclick="${p.pausado?'retomarPartida()':'pausarPartida()'}">${p.pausado?(intervalo?'▶ Iniciar 2º tempo':'▶ Continuar'):'⏸ Pausar e substituir'}</button>`}</div>
  ${!fim&&p.cobranca?painelCobranca():''}
  ${!fim&&p.pausado&&!p.cobranca?painelSubstituicao(m):''}
  ${p.copa?'':`<div class="grid g2">${lista('A')}${lista('B')}${lista('C')}${lista('D')}</div>`}`;
}
function telaTemporada(){
  const r=resumoTemporada(),m=meu();
  return `<div class="painel" style="max-width:700px;margin:0 auto"><h1 style="color:var(--amarelo)">Fim da temporada ${state.temporada}</h1>
  <p class="muted">${CONF_NOME[m.conf]}</p>
  <table style="margin:14px 0">
  ${['A','B','C','D'].map(d=>`<tr><td>Campeão da Série ${d}</td><td>🏆 ${linhaTime(r.campeoes[d])}</td></tr>`).join('')}
  <tr><td>Artilheiro</td><td>${esc(r.artilheiro.nome)} (${esc(state.times[r.artilheiro.time].nome)}) — ${r.artilheiro.gols} gols</td></tr>
  <tr><td>Seu time</td><td>${posicao(m.id)}º lugar na Série ${m.div}</td></tr></table>
  ${Object.values(r.campeoes).includes(m.id)?'<div class="ok">Título conquistado! Prêmio em dinheiro creditado na próxima temporada.</div>':''}
  ${r.transicoes.some(tr=>tr.caem.includes(m.id))?'<div class="aviso">Seu time foi rebaixado.</div>':''}
  ${r.transicoes.some(tr=>tr.sobem.includes(m.id))?'<div class="ok">Acesso garantido pra divisão de cima!</div>':''}
  <p class="muted">Na virada, os jogadores envelhecem: jovens evoluem, veteranos caem e quem passa dos 36 se aposenta.</p>
  <button class="primario" onclick="novaTemporada()">Continuar no ${esc(m.nome)} — iniciar temporada ${state.temporada+1}</button>
  <h3 style="margin-top:20px">Ou assuma outro clube</h3>
  <p class="muted">Ofertas de trabalho para a próxima temporada, de qualquer confederação. Seus títulos e sua carreira seguem com você; o elenco e a estrutura ficam com o ${esc(m.nome)}.</p>
  <div class="taticas">${ofertasClube().map(t=>`<button onclick="trocarClube(${t.id})">${esc(t.nome)} <span class="muted">(${CONF_NOME[t.conf]} · Série ${t.div}, força ${t.forca})</span></button>`).join('')}</div>
  </div>`;
}
function ofertasClube(){
  const m=meu();
  return state.times.filter(t=>t.id!==m.id).slice().sort(()=>Math.random()-.5).slice(0,3);
}
function trocarClube(novoId){
  const antigo=meu().nome,novo=state.times[novoId].nome;
  if(!confirm('Deixar o '+antigo+' e assumir o '+novo+' para a próxima temporada?'))return;
  novaTemporada();
  state.meuTime=novoId;state.rivalId=rivalDe(novoId);state.classico={v:0,e:0,d:0};
  gerarCopa();
  noticia('Você deixou o '+antigo+' e assumiu o comando do '+novo+'!');
  salvar();render();
}
render();
</script>
</body>
</html>
